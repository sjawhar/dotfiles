config:
  envoy:registry: ghcr.io/sjawhar/legion
  envoy:imageTag: aa6395134b37e3e0e267282f7444a9d6e122f0e3
  envoy:machines:
    # On-prem listeners are stateless NATS subscribers. They connect outbound
    # to the AWS Fargate `envoy-nats` over the host's existing Tailscale.
    # No tsnet sidecar — listeners are not their own Tailscale devices.
    # Webhook ingress (GitHub/Slack) lives on the Fargate envoy-listener
    # behind the ALB, NOT on on-prem listeners.
    # machineId matches this host's tailnet name so anything holding a registry
    # entry can reach the machine by that name. `name` stays `devbox-sami`: it is
    # the Pulumi URN component, and renaming it would replace the resource, which
    # collides on the fixed `envoy-listener` container name.
    - name: devbox-sami
      machineId: sami-agents
      listener: {}
    - name: sami
      sshHost: "ssh://sami@sami"
      machineId: sami
      listener: {}
    # oryx is reached over Tailscale SSH by MagicDNS FQDN; the bare name has no
    # ~/.ssh/config entry today, and the FQDN keeps it that way deliberately.
    - name: oryx
      sshHost: "ssh://agent@oryx.tailb86685.ts.net"
      machineId: oryx
      listener: {}
  envoy:githubWebhookSecret:
    secure: v1:DHpfNE2vubEaxKtd:sDJqUeZA3l2UW4w4NGRLEHKUvLraLygVoWB9MaqagpRBL8lAN5U1tjmZSBNj1COepP3AKYV+OwY=
  envoy:slackSigningSecret:
    secure: v1:jgP6XET6JwLTT8bn:ketvBJemrITJfFxEd42KajyVg9xXGwSUcdBnxM8VluQs+BleTU2Hss0BzjyKuG1R
  envoy:ghcrToken:
    secure: v1:Jx0lqnviYu9cA7rr:3GdTR57rbuNwSFwMJ0MikYKVFXPhoL5gc59iGWy2T0d9iLPCQhixLiW+/vQrHrw9buYpV4rRWko=
