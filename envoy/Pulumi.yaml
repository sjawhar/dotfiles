name: envoy
runtime: nodejs
description: Envoy fleet deployment via Docker over Tailscale SSH
# Pinned self-managed backend (workload account, us-west-2). Without this, a fresh
# machine silently defaults to the local ~/.pulumi backend and uses stale state.
backend:
  url: s3://trajectory-labs-pulumi?region=us-west-2
packages:
  envoy-infra:
    source: envoy-infra
    version: 0.3.1
    pluginDownloadURL: https://github.com/sjawhar/legion/releases/download/envoy-infra-v${VERSION}
