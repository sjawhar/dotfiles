creation_rules:
  - path_regex: secrets\.human\.env$
    age:
      - age1yubikey1qw82gvkljy5h07l7nrrgnqsma7np8ple5xntnq30d2qztdjvzfcqzdu80xr
      - age18fg9c68mlfmn5nz5tme0xzq4vkhx850p7293jrymhm9m8a2wxshqlmrw8h
  # Must stay ABOVE the default rule: sops uses the first matching rule, so this
  # ordering is what keeps these files off the machine keys.
  - path_regex: secrets\.human\.d/[^/]+\.env$
    age:
      - age1yubikey1qw82gvkljy5h07l7nrrgnqsma7np8ple5xntnq30d2qztdjvzfcqzdu80xr
      - age18fg9c68mlfmn5nz5tme0xzq4vkhx850p7293jrymhm9m8a2wxshqlmrw8h
  # Machine keys stay ABOVE the YubiKey: sops tries a file's recipients in order,
  # and a machine key listed after the YubiKey makes that machine wait on the
  # card (through the pcsc tunnel on a devbox) on every agent-tier read before
  # its own key is tried. Add a new machine key above the YubiKey line, then run
  # `sops updatekeys secrets.env`, which writes recipients in this order.
  - age:
      - age1jf63nvl6uenkwalyysa5hqv0k7ks5k6mjggqxlj7fwwp0gnkfvxszyxd2q
