# logrotate every hour on sami-devbox, not daily (dispatch://INFRA-5287): the size bound of
# devbox/logrotate-rsyslog holds only as often as logrotate runs. devbox/gce-host.sh installs this as
# /etc/systemd/system/logrotate.timer.d/50-hourly.conf. A file rotated by time still rotates at its
# own interval: logrotate's state file keeps when it last rotated each one.
[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=5min
