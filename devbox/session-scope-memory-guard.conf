# Bound each login session scope.
#
# Installed by installers/omp-box-memory-guard.sh as
# /etc/systemd/system/session-.scope.d/60-omp-memory-guard.conf. logind names every login
# session's cgroup `session-<N>.scope`, and systemd reads drop-ins for a dashed unit name from
# the truncated-prefix directory as well as the exact one (systemd.unit(5), "Along with a unit
# file foo-bar-baz.service, the directory foo-.service.d/ may exist"). That is how one static
# file reaches scopes nothing writes a unit file for. Verified on 2026-11-06 with
# `systemd-analyze --root=<tmp> verify foo-99.service` against a `foo-.service.d/` drop-in: a
# deliberately bad `MemoryMax=` was reported with this file's path and line, so the prefix
# directory is read and these directives are parsed; a .scope cannot be verified that way
# because scopes are transient and `systemd-analyze verify` will not load one from disk.
#
# Why: on 2026-11-06 one job ran in a plain ssh session scope on sami-devbox, grew to 684 GiB
# with no limit of any kind, took MemAvailable to 8%, and earlyoom answered with about 500
# SIGTERMs across the fleet -- every lane on the machine paid for one unbounded login. Agent
# boxes and `shims/omp` sessions carry their own cgroup ceilings; a bare `ssh` or `tmux` shell
# carries none, and `user-<uid>.slice`'s 92% (devbox/user-slice-memory-guard.conf) is the whole
# user's aggregate, so a single session can reach it alone.
#
# This is deliberately NOT a cap on user-<uid>.slice beyond that 92%: agent boxes, the host
# services and every per-session scope live under it, and tightening it would bound them
# together instead of bounding the one offender.
#
# The numbers are absolute, not percentages, because what is being bounded is what ONE
# interactive login legitimately needs (the largest honest single-session footprint measured on
# this fleet is a Rocq/Lean build at tens of GiB), not a share of the machine. On sami-devbox's
# 2,196 GiB that is 8.7% high / 11.6% max per session. The installer therefore applies this
# file only on a machine with at least 512 GiB, where 256 GiB is a real cap well under the
# slice ceiling; on a 251 GiB box these values would be a no-op for MemoryMax and nothing but a
# throttle for MemoryHigh.
#
# MemoryHigh=192G throttles and reclaims before the kill, so a session that overruns slows
# down and sheds page cache instead of dying; MemoryMax=256G is the hard stop, and the kernel's
# OOM kill then lands INSIDE the offending session rather than on sshd, journald, dockerd or
# another lane. The page-cache objection that keeps MemoryHigh off the user slice
# (devbox/user-slice-memory-guard.conf) does not carry here: that slice aggregates every
# session's file cache on a build farm, while one login session's own cache at 192 GiB is
# already far outside normal operation.
#
# This takes effect on the sessions that are ALREADY LOGGED IN, at the `systemctl
# daemon-reload` that installs it -- not at their next login. Measured on sami-devbox
# 2026-11-06T20:14Z: session-10548.scope, started long before this file existed, showed
# MemoryMax=256G straight after the reload. That is why installers/omp-box-memory-guard.sh
# reads every live session scope's MemoryCurrent first and refuses to write this file at all
# while one of them is over MemoryMax: capping a session that is already above its new ceiling
# OOM-kills the work inside it the moment the reload lands.
[Scope]
MemoryHigh=192G
MemoryMax=256G
