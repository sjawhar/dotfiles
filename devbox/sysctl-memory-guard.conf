# Reclaim settings for an agent box with swap, installed by
# installers/omp-box-memory-guard.sh as /etc/sysctl.d/70-omp-memory-guard.conf. 70 is above
# agent-infra's 60-guard.conf, which sets none of these.
#
# @MIN_FREE_KB@ is filled in at install time from this machine's RAM: the file is a template,
# because that one value is an absolute number of kilobytes while the other two are ratios.

# Swap is relief, not routine. The box has 141 GiB of page cache, nearly all of it build
# output that is cheap to read again, so the kernel should drop cache first and swap only when
# dropping cache is not enough. 10 keeps cold anonymous memory movable without paging out the
# working set of a live agent session.
vm.swappiness = 10

# Start reclaiming earlier. 10 (the default, 0.1% of each zone) leaves about 250 MiB of
# headroom between "kswapd wakes" and "an allocation has to reclaim in its own context" -- on a
# 251 GiB box with 64 cores allocating at up to 23 GiB/min, kswapd wakes far too late and every
# core ends up in direct reclaim. That is the 95-99% SYSTEM cpu with 0% idle that wedged
# sami-rocqperf from 09:00Z on 2026-10-27. 100 (1%) gives kswapd 2.5 GiB of runway per zone.
vm.watermark_scale_factor = 100

# The floor the kernel keeps for allocations that cannot wait. The default on this box was
# 67,584 kB -- 66 MiB out of 251 GiB -- and an ext4 writeback allocation failed inside
# shrink_slab at 09:14:55Z on 2026-10-27 because of it. The installer sets 0.4% of RAM, capped
# at 1 GiB.
vm.min_free_kbytes = @MIN_FREE_KB@
