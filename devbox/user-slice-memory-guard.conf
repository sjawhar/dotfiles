# Bound the aggregate that nobody bounded.
#
# Installed by installers/omp-box-memory-guard.sh as
# /etc/systemd/system/user-.slice.d/60-omp-memory-guard.conf, so it applies to every
# `user-<uid>.slice` logind creates. 60 is above agent-infra's monitoring/host/guard.sh, which
# owns the 50-guard.conf drop-ins on this box; a re-apply of that script leaves this one in
# place.
#
# Why here and not on the per-session scopes: `shims/omp` caps a session only when
# OMP_MEMORY_MAX is set, and almost nothing sets it. Measured on sami-rocqperf 2026-10-27T14:57Z,
# user-1000.slice held 193 GiB, of which 156 GiB was ONE unlimited login scope
# (session-3.scope, 1,463 processes: tmux panes and everything they start) and only 36 GiB the
# per-session scopes under app.slice. Capping app.slice would have bounded the 36 GiB and left
# the 156 GiB alone.
#
# MemoryHigh=82% (206 GiB of this box's 251.67 GiB) is the throttle. Over it the kernel
# reclaims inside the slice and slows the tasks that keep allocating; it kills nothing. 82% is
# above the slice's steady state (180-193 GiB measured across 2026-10-26/27, of which ~72 GiB
# is page cache the kernel gives back for free) and below the 240 GiB peak it reached while the
# box was dying, so it bites in a runaway and not in ordinary work. What it costs when it
# bites: every session in the slice gets slower, because the kernel charges the allocating task
# for the reclaim. That is the trade -- slow sessions instead of a box that stops answering --
# and it is why the same installer adds swap: without swap the kernel cannot reclaim anonymous
# memory at all, and the throttle becomes a stall rather than a slowdown.
#
# MemoryMax=92% (231.5 GiB) is the hard stop, 25 GiB above the throttle. That gap is about one
# minute at the fastest sustained fall measured on this box (23 GiB/min on 2026-10-26T07:36:50Z),
# which is the time omp-box-memory-guard needs to shed a session (a 5 s cycle, a 10 s SIGTERM
# grace). Past it the kernel OOM-kills INSIDE this slice, so the victim is always one of the
# user's own processes and never journald, sshd, tailscaled, dockerd or secretsd -- 20 GiB of
# RAM stays outside this slice for them, against a measured steady system.slice of 3.4 GiB.
[Slice]
MemoryHigh=82%
MemoryMax=92%
