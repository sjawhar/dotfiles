# Bound the aggregate that nobody bounded.
#
# Installed by installers/omp-box-memory-guard.sh as
# /etc/systemd/system/user-.slice.d/60-omp-memory-guard.conf, so it applies to every
# `user-<uid>.slice` logind creates. 60 is above agent-infra's monitoring/host/guard.sh, which
# owns the 50-guard.conf drop-ins on this box; a re-apply of that script leaves this one in
# place.
#
# Why here and not on the per-session scopes: `shims/omp` caps a session only when
# OMP_MEMORY_MAX is set, and almost nothing sets it. Measured on sami-rocqperf 2026-10-27T14:57Z,
# user-1000.slice held 193 GiB, of which 156 GiB was ONE unlimited login scope
# (session-3.scope, 1,463 processes: tmux panes and everything they start) and only 36 GiB the
# per-session scopes under app.slice. Capping app.slice would have bounded the 36 GiB and left
# the 156 GiB alone.
#
# MemoryMax=92% (231.5 GiB of this box's 251.67 GiB) is the hard stop. Past it the kernel
# OOM-kills INSIDE this slice, so the victim is always one of the user's own processes and never
# journald, sshd, tailscaled, dockerd or secretsd: 20 GiB of RAM stays outside this slice for
# them and the kernel, against a measured steady system.slice of 3.4 GiB.
#
# There is deliberately NO MemoryHigh. A memory.high throttles by charging the allocating task
# for the slice's reclaim whenever memory.current (page cache included) is over it. On a
# Rocq/Lean build farm the slice legitimately runs cache-heavy and sits on any memory.high: at
# 82% it logged 114,783 throttle events in 29 minutes, churning ~82 GiB of file cache and
# pushing ~45 GiB to swap, a throughput charge on every session for no gain, since page cache is
# reclaimed for free anyway. "Reclaim before the kill" is done box-wide and per-task-free by the
# kswapd watermarks the installer's sysctl sets (vm.watermark_scale_factor); the graduated step
# between normal operation and this hard cap is scripts/omp-box-memory-guard, which sheds one
# session when the slice's UNRECLAIMABLE memory nears this ceiling, before the kernel OOMs.
[Slice]
MemoryMax=92%
