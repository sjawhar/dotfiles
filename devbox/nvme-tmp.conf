# Scratch on the big disk for systemd --user services.
#
# ~/.dotfiles/.bashrc defaults TMPDIR and GOTMPDIR to /mnt/nvme/<user> for every shell, and
# scripts/agent-session does it for every agent session, but the systemd --user manager reads
# neither: a user service starts with TMPDIR unset, so anything it runs writes its scratch into
# /tmp on the root disk. That disk is shared by every session on the box and was at 95% on
# 2026-10-29 (dispatch://INFRA-6).
#
# Only installed on a machine that has /mnt/nvme/<user> and can write to it, and only after
# devbox/install.sh has made both directories; environment.d has no conditionals, so the
# condition lives in the installer. A unit that sets its own TMPDIR or GOTMPDIR still wins:
# a unit file's Environment= overrides the manager environment.
#
# environment.d expands shell-style variables, not systemd unit specifiers; the manager's own
# environment carries USER (systemctl --user show-environment).
TMPDIR=/mnt/nvme/${USER}/tmp
GOTMPDIR=/mnt/nvme/${USER}/gotmp
