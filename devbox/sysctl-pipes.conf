# Per-user pipe buffer soft limit on sami-devbox (pages; 16 pages = one 64 KiB pipe).
# devbox/gce-host.sh copies this file to /etc/sysctl.d/90-pipe-user-pages.conf and applies it
# (installers/lib.sh ensure_sysctl_conf); systemd-sysctl applies it at each boot.
#
# Over the soft limit, every new pipe a user opens gets 8 KiB instead of 64 KiB, and a program that
# writes more than 8 KiB into a pipe and starts reading the other end only after that write
# finishes blocks for good: on 2026-11-22 actionlint hung on envoy.yaml (shellcheck scripts over
# 8 KiB) with sami holding ~1,584 pipes across ~2,150 processes, over the default 16384. Raised by
# hand 2026-11-22 01:57Z, after which the same actionlint run took 1.0 s instead of hitting its
# 600 s timeout. 262144 pages is 16,384 full pipes per user, ten times what sami held then; the
# hard limit stays 0 (none).
#
# Rollback: set 16384 (the kernel's default) below, then run devbox/gce-host.sh again.
fs.pipe-user-pages-soft = 262144
