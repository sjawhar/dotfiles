# The open-file limit of the processes tailscaled and sshd start on sami-devbox
# (dispatch://INFRA-993). devbox/gce-host.sh copies this to
# /etc/systemd/system/{tailscaled,ssh}.service.d/60-nofile.conf (50-guard.conf is agent-infra's).
#
# A command over Tailscale SSH is a child of tailscaled, not of sshd, and a non-pty one gets no
# PAM session, so pam_limits never applies to it. Ubuntu's tailscaled.service sets no soft limit,
# so it is systemd's 1024; the Go runtime raises its own and gives the 1024 back to every process
# it starts. git receive-pack into a clone of 11,416 packs failed at that limit (2026-11-03).
# sshd's sessions start at its 1024 the same way: pam_limits runs there, but no limits.d file
# names nofile. 65536 soft; the hard limit stays systemd's 524288.
[Service]
LimitNOFILE=65536:524288
