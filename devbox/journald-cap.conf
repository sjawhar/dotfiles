# journald's cap on sami-devbox's boot disk (dispatch://INFRA-993, "Shape and disks": the boot disk
# holds the OS only). devbox/gce-host.sh copies this to
# /etc/systemd/journald.conf.d/50-sami-devbox.conf and restarts systemd-journald, which keeps its
# clients' log streams across the restart.
#
# SystemMaxUse: the journal in /var/log/journal stays under 2 GiB (journald's own default is 10% of
# the filesystem, capped at 4 GiB). SystemKeepFree: journald removes its oldest files so that / keeps
# 50 GiB free, the floor that disk-fill-watch and the bulk copy's monitor hold for /
# (devbox/sami-devbox.md, "Load guards").
[Journal]
SystemMaxUse=2G
SystemKeepFree=50G
