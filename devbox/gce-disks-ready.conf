# Drop-in that devbox/gce-host.sh copies into user@1000.service.d, docker.service.d,
# containerd.service.d and sysbox-mgr.service.d on sami-devbox (devbox/gce-disks.service).
#
# The unit starts only after devbox/gce-disks brought every disk up and wrote its ready file,
# which lives in /run and so is gone at each boot until the script succeeds again. Otherwise the
# user manager would start in the boot disk's empty /home and Docker on an empty /var/lib/docker,
# and each would fill the boot disk with state that the bind then hides. An assertion, not
# Requires=, so re-running gce-disks by hand does not restart this unit.
[Unit]
Wants=gce-disks.service
After=gce-disks.service
AssertPathExists=/run/gce-disks/ready
