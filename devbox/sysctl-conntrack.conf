# How long conntrack remembers a closed TCP flow (TIME_WAIT) on sami-devbox. installers/docker.sh
# (DOCKER_CONNTRACK_TIME_WAIT=1, which devbox/gce-host.sh sets) copies this file to
# /etc/sysctl.d/90-conntrack-time-wait.conf and applies it.
#
# Why: each container start and each container exit holds one bridge-driver lock for the whole
# host while dockerd dumps the conntrack table: 209-284 ms per dump at sami-devbox's 56,000-62,000
# entries. On 2026-11-21, 92% of those entries were TCP flows in TIME_WAIT, which the kernel keeps
# for 120 s by default. On a scratch VM with a table of the same size, 15 s cut
# `docker run --rm busybox true` from 11.90 s to 6.46 s (p50) and from 13.36 s to 7.20 s (p95),
# with no dockerd restart.
#
# Only conntrack's record of the flow ends sooner: the endpoints' own TCP TIME_WAIT (60 s) does
# not change. nf_conntrack is built into the gcp kernel (modules.builtin), so systemd-sysctl
# applies this file at boot.
#
# Rollback: set 120 (the kernel's default) below, then run installers/docker.sh again with
# DOCKER_CONNTRACK_TIME_WAIT=1 (devbox/gce-host.sh does).
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 15
