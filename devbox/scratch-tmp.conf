# Scratch on the local-SSD RAID for systemd --user services, on sami-devbox.
#
# devbox/nvme-tmp.conf's counterpart for a machine where devbox/gce-disks mounts the local SSDs at
# /mnt/scratch and makes /mnt/scratch/<user> at every boot (dispatch://INFRA-993, "Shape and
# disks": /tmp-class data goes to the disk a stop may erase, not the state disk). .bashrc and
# scripts/agent-session point shells and sessions there too. devbox/install.sh links this file
# instead of nvme-tmp.conf when that directory exists; environment.d has no conditionals.
TMPDIR=/mnt/scratch/${USER}/tmp
GOTMPDIR=/mnt/scratch/${USER}/gotmp
