[repos.oh-my-pi]
upstream = "https://github.com/can1357/oh-my-pi"
# The repository moved from sjawhar to cybermonklabs. The old URL redirected, so every push and
# fetch kept working and nothing failed — which is why this line stayed wrong for weeks. Found
# 2026-11-10 while handing the entry to another lane, which would have copied it.
origin = "https://github.com/cybermonklabs/oh-my-pi"
release_branch = "sami"
ledger = "sjawhar/.knives-ledger"
# installers/knives.sh rewrites this line to the machine's big local disk where it has one; this
# value is what a machine without one gets, since no committed file names a machine's own path.
workspaces = "~/.worktrees/oh-my-pi"
# Internal names an upstream-bound diff must not add (knives audit scans added lines; a
# fork-only branch is exempt). "sjawhar" is not listed: it is the required changelog attribution.
# "agent-c" is matched only as a path/slug segment: bare it collides with upstream's @oh-my-pi/pi-agent-core.
# "agentc-" catches internal issue keys (AGENTC-123); "legion" already catches LEGION- keys.
# A term that names a customer is in the private part, repos.local.toml (installers/knives.sh).
forbidden = ["trajectory-labs", "trajectory_labs", "trajectorylabs", "/agent-c", "agent-c/", "agentc-", "cybertask", "legion", "luthien", "middleman", "sami-agents", ".worktrees/", "secretsd", "envoy", "dispatch://", "knives", "notch", "orchestrator"]

