# Shared jj config. Shells (.bashrc) and agent boxes load it through JJ_CONFIG
# after ~/.config/jj/config.toml, the per-machine file holding user.name and
# user.email, so a value here wins over that file. jj run without JJ_CONFIG
# reads this file through the ~/.jjconfig.toml symlink first, and that file wins.

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'

[aliases]
tug = ["bookmark", "move", "--from", "closest_bookmark(@)", "--to", "@"]
agent-log = ["log", "--no-graph", "-T", "agent_log"]

[ui]
# Interactive users receive nvim. `jj-editor` refuses to launch any editor without
# stdin/stdout/stderr TTYs and tells agents to use -m/-u instead, preventing a missing
# noninteractive flag from spawning an unusable IDE.
editor = "jj-editor"

# Use git diff format when running inside AI agents
# (agents can't parse color-words output)
[[--scope]]
--when.environments = ["AGENT", "OPENCODE", "CLAUDECODE"]
[--scope.ui]
diff-formatter = ":git"
[--scope.template-aliases]
agent_log = '''
"{" ++
"\"change\":" ++ stringify(change_id.shortest(4)).escape_json() ++ "," ++
"\"commit\":" ++ stringify(commit_id.shortest(6)).escape_json() ++ "," ++
"\"parents\":[" ++ parents.map(|p| stringify(p.change_id().shortest(4)).escape_json()).join(",") ++ "]," ++
"\"bookmarks\":[" ++ local_bookmarks.map(|b| "{\"name\":" ++ b.name().escape_json() ++ ",\"synced\":" ++ json(b.synced()) ++ "}").join(",") ++ "]," ++
"\"timestamp\":\"" ++ author.timestamp().utc().format("%Y-%m-%dT%H:%M:%SZ") ++ "\"," ++
if(working_copies, "\"workspace\":" ++ stringify(working_copies).escape_json() ++ ",") ++
"\"current\":" ++ json(self.contained_in("@")) ++ "," ++
"\"empty\":" ++ json(empty) ++ "," ++
"\"conflict\":" ++ json(conflict) ++ "," ++
"\"divergent\":" ++ json(divergent) ++ "," ++
"\"immutable\":" ++ json(immutable) ++ "," ++
"\"desc\":" ++ if(description, description.first_line().escape_json(), "null") ++
"}\n"
'''

# Watchman-based filesystem monitor — avoids full tree walk on every command.
# Requires watchman installed (see installers/jj.sh).
[fsmonitor]
backend = "watchman"

# Git LFS via the jj fork's gitattributes filter drivers (jj-vcs/jj#8719):
# clean on snapshot, smudge on checkout; `required` makes a filter failure an error.

[git.filter]
enabled = true

[git.filter.drivers.lfs]
required = true
clean = ["git-lfs", "clean", "--", "$path"]
smudge = ["git-lfs", "smudge", "--", "$path"]

# Commit signing: per-machine software key (~/.ssh/jj-signing), registered on
# GitHub as a signing key for each machine. "own" re-signs silently on every
# rewrite - no interaction, agent-safe. Pair with GitHub vigilant mode so
# unsigned commits claiming this identity get flagged. A touch-gated
# ceremonial key (ed25519-sk + `jj sign -r <revset>`) can layer on later.
[signing]
behavior = "own"
backend = "ssh"
key = "~/.ssh/jj-signing.pub"

[signing.backends.ssh]
allowed-signers = "~/.dotfiles/jj-allowed-signers"

# sjawhar/legion is public and commits as sami@thecybermonk.com. jj has no
# remote condition, so this matches Legion's jj checkout by path. Every
# workspace of a repository has its main checkout's repository path, so the one
# entry covers every workspace of ~/src/legion wherever it lives. The Legion
# daemon's own workspaces commit as their role's GitHub App through
# JJ_USER/JJ_EMAIL, which outrank any config. git's half of the rule is the
# remote-URL include in .gitconfig, and the two must agree: with behavior =
# "own", jj drops the signature of a commit whose author email is not its
# user.email when it rewrites it, so a commit git made as cybermonk would lose
# its signature the first time jj rewrote it as trajectorylabs.
[[--scope]]
--when.repositories = ["~/src/legion"]
[--scope.user]
name = "Sami Jawhar"
email = "sami@thecybermonk.com"
