# Shared jj config. Shells (.bashrc), agent boxes and omp sessions
# (omp/extensions/session-env.ts) load it through JJ_CONFIG after
# ~/.config/jj/config.toml, the per-machine file holding user.name and
# user.email, so a value here wins over that file, the identity scopes below
# included. jj run with no JJ_CONFIG reads this file (the ~/.jjconfig.toml link)
# first and the per-machine file after it, so the per-machine user.email wins
# over every identity scope: such a jj commits with the per-machine identity in
# every repository.

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'

[aliases]
tug = ["bookmark", "move", "--from", "closest_bookmark(@)", "--to", "@"]
agent-log = ["log", "--no-graph", "-T", "agent_log"]

[ui]
# Interactive users receive nvim. `jj-editor` refuses to launch any editor without
# stdin/stdout/stderr TTYs and tells agents to use -m/-u instead, preventing a missing
# noninteractive flag from spawning an unusable IDE.
editor = "jj-editor"

# Use git diff format when running inside AI agents
# (agents can't parse color-words output)
[[--scope]]
--when.environments = ["AGENT", "CLAUDECODE"]
[--scope.ui]
diff-formatter = ":git"
[--scope.template-aliases]
agent_log = '''
"{" ++
"\"change\":" ++ stringify(change_id.shortest(4)).escape_json() ++ "," ++
"\"commit\":" ++ stringify(commit_id.shortest(6)).escape_json() ++ "," ++
"\"parents\":[" ++ parents.map(|p| stringify(p.change_id().shortest(4)).escape_json()).join(",") ++ "]," ++
"\"bookmarks\":[" ++ local_bookmarks.map(|b| "{\"name\":" ++ b.name().escape_json() ++ ",\"synced\":" ++ json(b.synced()) ++ "}").join(",") ++ "]," ++
"\"timestamp\":\"" ++ author.timestamp().utc().format("%Y-%m-%dT%H:%M:%SZ") ++ "\"," ++
if(working_copies, "\"workspace\":" ++ stringify(working_copies).escape_json() ++ ",") ++
"\"current\":" ++ json(self.contained_in("@")) ++ "," ++
"\"empty\":" ++ json(empty) ++ "," ++
"\"conflict\":" ++ json(conflict) ++ "," ++
"\"divergent\":" ++ json(divergent) ++ "," ++
"\"immutable\":" ++ json(immutable) ++ "," ++
"\"desc\":" ++ if(description, description.first_line().escape_json(), "null") ++
"}\n"
'''

# Watchman-based filesystem monitor — avoids full tree walk on every command.
# Requires watchman installed (see installers/jj.sh).
[fsmonitor]
backend = "watchman"

# Git LFS via the jj fork's gitattributes filter drivers (jj-vcs/jj#8719):
# clean on snapshot, smudge on checkout; `required` makes a filter failure an error.

[git.filter]
enabled = true

[git.filter.drivers.lfs]
required = true
clean = ["git-lfs", "clean", "--", "$path"]
smudge = ["git-lfs", "smudge", "--", "$path"]

# Commit signing: per-machine software key (~/.ssh/jj-signing), registered on
# GitHub as a signing key for each machine. "own" re-signs silently on every
# rewrite - no interaction, agent-safe. Pair with GitHub vigilant mode so
# unsigned commits claiming this identity get flagged. A touch-gated
# ceremonial key (ed25519-sk + `jj sign -r <revset>`) can layer on later.
[signing]
behavior = "own"
backend = "ssh"
key = "~/.ssh/jj-signing.pub"

[signing.backends.ssh]
allowed-signers = "~/.dotfiles/jj-allowed-signers"

# A repository commits as the identity git resolves for it: .gitconfig's
# remote-URL rules (every cybermonklabs repository as sami@thecybermonk.com,
# every theorem-labs one as sami@theorem.dev) and a checkout's own git config
# (~/src/oh-my-pi's noreply address) decide jj's identity too, in every
# checkout and every workspace of it, wherever it lives. jj has no remote
# condition, so shims/jj asks git about the backing git repository and passes
# its user.email as DOTFILES_GIT_EMAIL, and each scope below turns one identity
# scripts/git-identity knows into jj's user.name and user.email. The two tools
# must agree: with behavior = "own", jj drops the signature of a commit whose
# author email is not its user.email when it rewrites it, so a commit git made
# as cybermonk would lose its signature the first time jj rewrote it as
# trajectorylabs. These scopes are user config, so a repository's or a
# workspace's own jj user.email (`git-identity`, `jj config set --repo`) wins
# over them, and JJ_USER/JJ_EMAIL, the Legion daemon's GitHub App identity,
# over both. A jj run without the shim, or under an address git-identity does
# not know, keeps the per-machine user.email.
[[--scope]]
--when.environments = ["DOTFILES_GIT_EMAIL=sami@trajectorylabs.net"]
[--scope.user]
name = "Sami Jawhar"
email = "sami@trajectorylabs.net"

[[--scope]]
--when.environments = ["DOTFILES_GIT_EMAIL=sami@thecybermonk.com"]
[--scope.user]
name = "Sami Jawhar"
email = "sami@thecybermonk.com"

[[--scope]]
--when.environments = ["DOTFILES_GIT_EMAIL=sami@theorem.dev"]
[--scope.user]
name = "Sami Jawhar"
email = "sami@theorem.dev"

[[--scope]]
--when.environments = ["DOTFILES_GIT_EMAIL=sjawhar@users.noreply.github.com"]
[--scope.user]
name = "Sami Jawhar"
email = "sjawhar@users.noreply.github.com"
