# Global mise tool configuration
# Symlinked to ~/.config/mise/config.toml
# All versions pinned for reproducibility

[settings]
# My own repos are exempt from the release-age filter. That delay exists so a
# third-party compromise has time to surface before I install it, which buys
# nothing for code my own attested CI just built -- and mise still verifies
# GitHub build provenance on every install either way. Third-party tools keep
# the filter. secretsd matters most here: it is the secrets broker, and its
# daemon and OpenCode plugin ship together, so a fix cannot reach a machine at
# all until the release is installable.
# mise matches these entries EXACTLY -- a "github:sjawhar/*" glob is accepted
# and then silently ignored -- so a new repo of mine has to be added by hand.
# Alias short names sit beside their backend ids because either form can be
# requested (`mise exec -- forward`, `[tools.tt]`).
minimum_release_age_excludes = [
  "github:sjawhar/forward",
  "github:sjawhar/jj",
  "github:sjawhar/knives",
  "github:sjawhar/oh-my-opencode",
  "github:sjawhar/opencode",
  "github:sjawhar/secretsd",
  "github:sjawhar/time-tracker",
  "forward",
  "tt",
  "tt-watcher",
]

[tools]
"github:sjawhar/jj" = "latest"  # Custom fork with workspace-cli, LFS ignore-filters, gitattr filter fixes
"github:sjawhar/knives" = "0.7.0"
"github:sjawhar/secretsd" = "latest"  # Session secrets broker; ships bin/secrets + systemd units
"github:syncthing/syncthing" = "latest"
"github:tmux/tmux-builds" = "3.7b"
bat = "0.26.1"      # Cat with syntax highlighting
bun = "1.3.14"
eza = "0.23.5"
fd = "10.4.2"
fzf = "0.74.1"
gh = "latest"
glow = "2.1.2"
jq = "1.8.2"
neovim = "0.12.4"
ripgrep = "15.2.0"
rust = "1.97.1"
starship = "1.26.0"
uv = "0.11.32"
yq = "4.53.3"
zoxide = "0.10.0"

"github:korotovsky/slack-mcp-server" = "1.3.0"
"github:sjawhar/oh-my-opencode" = "latest"  # Custom fork
"github:sjawhar/opencode" = "latest"
"npm:@googleworkspace/cli" = "0.22.5"
"npm:@openai/codex" = "0.145.0"

# Development
"npm:basedpyright" = "1.39.9"
actionlint = "latest"
awscli = { version = "2.36.9", symlink_bins = "true" }
cmake = "4.3.3"
depot = "2.101.75"
go = "1.26.5"
helm = "latest"
kubectl = "latest"
node = "26.5.0"
opentofu = "1.12.5"
shellcheck = "0.11.0"

# Secrets management
"github:str4d/age-plugin-yubikey" = "0.5.0"  # Hardware-backed age identities (YubiKey PIV); 0.5.1 has no linux release assets
age = "1.3.1"       # Modern file encryption (for sops)
sops = "3.13.3"

# Observability
"cargo:cargo-deny" = "latest"
"github:DataDog/pup" = "1.8.0"
sentry-cli = "3.6.2"
k9s = "latest"

# AI-native time tracker — one release publishes two binaries as separate assets:
#   tt-{arch}-unknown-linux-musl.tar.gz  (CLI, static)
#   tt-watcher-{arch}-unknown-linux-gnu.tar.gz  (COSMIC daemon, glibc)
# Use [tool_alias] + per-platform asset_pattern (the documented mise pattern for
# multiple assets from one release). Distinct aliases give each binary its own
# install dir; bare "github:sjawhar/time-tracker" entry must NOT coexist or it
# collides on the install path.
# `forward` has one release asset, but its alias supplies the short name used by
# the installer guard and `mise exec -- forward`.
[tool_alias]
tt = "github:sjawhar/time-tracker"
tt-watcher = "github:sjawhar/time-tracker"
forward = "github:sjawhar/forward"

[tools.tt]
version = "latest"
platforms.linux-x64   = { asset_pattern = "tt-x86_64-unknown-linux-musl.tar.gz" }
platforms.linux-arm64 = { asset_pattern = "tt-aarch64-unknown-linux-musl.tar.gz" }

[tools.tt-watcher]
version = "latest"
platforms.linux-x64   = { asset_pattern = "tt-watcher-x86_64-unknown-linux-gnu.tar.gz" }
platforms.linux-arm64 = { asset_pattern = "tt-watcher-aarch64-unknown-linux-gnu.tar.gz" }

[tools.forward]
version = "latest"
# Public releases are verified with GitHub build attestations during installation.
platforms.linux-x64   = { asset_pattern = "forward-x86_64-unknown-linux-musl.tar.gz" }
platforms.linux-arm64 = { asset_pattern = "forward-aarch64-unknown-linux-musl.tar.gz" }

# Device management CLI (osquery/MDM). Each fleetdm/fleet release bundles two
# binaries — fleet (server) + fleetctl — so asset_pattern selects the fleetctl
# archive; the release tag is prefixed "fleet-v". The npm "fleetctl" package is
# only a runtime binary downloader, so the github backend gives a pinned static binary.
[tools."github:fleetdm/fleet"]
version = "fleet-v4.87.0"
platforms.linux-x64   = { asset_pattern = "fleetctl_v4.87.0_linux_amd64.tar.gz" }
platforms.linux-arm64 = { asset_pattern = "fleetctl_v4.87.0_linux_arm64.tar.gz" }
platforms.macos-x64   = { asset_pattern = "fleetctl_v4.87.0_macos.tar.gz" }
platforms.macos-arm64 = { asset_pattern = "fleetctl_v4.87.0_macos.tar.gz" }
