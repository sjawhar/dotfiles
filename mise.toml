platforms.linux-arm64 = { asset_pattern = "forward-aarch64-unknown-linux-musl.tar.gz" }

# secretsd from the same forward release (consolidation: one repo,
# one tag, three artefacts). Native glibc, x86_64 only, deliberately: it
# depends on mlockall and pidfd behaviour a static musl build would change,
# and it runs on oryx and the devbox. Its archive ships bin/secrets plus the
# systemd units, which installers/secretsd.sh reads straight out of this
# install dir.
[tools.secrets]
# Pinned to an exact release, not "latest": the client and daemon share a protocol version that
# moved in 3.3.0. A bump moves the client at once. The daemon's unit names the pinned release's own
# directory, so the daemon runs its old release until installers/secretsd.sh runs on that machine
# (install.sh runs it); that run restarts it when no grant is live, or with
# SECRETSD_RESTART_WITH_GRANTS=1 after the box is told (a restart drops every live grant). So
# bump only to a release whose protocol version is the running daemon's - 2026-09-21 a "latest"
# client rolled to 3.3.1 under a 3.2.3 daemon and every human-tier request from every box failed
# VersionMismatch.
# mise needs a GitHub token for the release lookup (the unauthenticated API limit is 60/h and this
# machine exhausts it) -- [settings.github] credential_command above supplies one (gh-app-token, the
# same credential git's own GitHub App routing uses).
# 3.7.0 (2026-10-26) names the store behind every answer and refusal (sjawhar/forward#67). Its
# wire protocol is still 4, the same as 3.3.1 (`git diff v3.3.1 v3.7.0 -- crates/proto` adds only
# a client-side accessor), so this client was proven read-only against the running 3.3.1 daemon
# (`secrets grants`, `secrets get <human key> --no-request`) and the daemon was not restarted; its
# unit runs installs/secrets/latest, so its next start runs 3.7.0.
# 3.8.2 (2026-11-07) refuses a REGISTER or UNREGISTER that would displace or remove a session a
# live process holds, unless the caller is that process or its descendant (sjawhar/forward#77,
# dispatch://INFRA-1644). Wire protocol is still 4 (`git diff v3.7.0 v3.8.2 -- crates/proto` is
# empty). The daemon keeps registrations in memory, and the omp extension re-registers the same
# token when the handshake's instance id changes, so a restart costs each session at most one
# UNKNOWN_TOKEN answer on its first call.
# 3.8.3 (2026-11-16) makes `forward browser grant` work from a Legion pane (sjawhar/forward#78):
# the daemon scopes an AUTHORIZE that carries no token and no terminal to the caller's nearest omp
# process, and it retries a failed YubiKey attempt until the request's time to live ends, so a grant
# from a Legion pane needs a 3.8.3 daemon. Wire protocol is still 4 (`git diff v3.8.2 v3.8.3 --
# crates/proto` changes one doc comment), so this client was proven read-only against the running
# 3.8.2 daemon (`secrets grants`, `secrets get <human key> --no-request`). The daemon is restarted
# after the merge, at a time its owner allows.
# 3.8.4 (2026-11-21) finds the caller's omp process by the name in its /proc/<pid>/stat, not by its
# exe link, which the daemon cannot read from the hardened unit's own user namespace: under that
# unit a 3.8.3 daemon refused every pane grant (NO_SCOPE), and 3.8.4 grants a Legion pane browser
# access (sjawhar/forward#79). Its wire protocol is still 4, the same as 3.8.3 (`git diff v3.8.3
# v3.8.4 -- crates/proto` is empty), so this client was proven read-only against the running 3.8.3
# daemon (`secrets grants`, `secrets get <human key> --no-request`). The daemon and `forward serve`
# are restarted after the merge, at a time no grant is live and no OAuth callback is armed.
# 3.8.5 (2026-11-23): a 3.8.5 daemon's `secrets grants` lists requests that wait for a touch,
# receipts not yet redeemed and capability grants beside the secret grants (sjawhar/forward#80), so
# its `no active grants` means none of the four is live (a restart still drops the session
# registrations, which it does not list). Wire protocol is still 4 (PROTOCOL_VERSION is 4 at v3.8.4
# and v3.8.5), so this client was proven read-only against the running 3.8.4 daemon (`secrets
# grants`, `secrets get <human key> --no-request`). A 3.8.4 daemon lists secret grants only, so the
# restart onto 3.8.5 is made after the merge only when its journal and its open connections show
# none of the four live. From 3.8.5 each `forward browser grant` leaves a capability grant for
# SECRETSD_MAX_GRANT_SECS (12 h by default) after its redeem, and for that long
# installers/secretsd.sh refuses a restart and stops install.sh; wait it out, or re-run with
# SECRETSD_RESTART_WITH_GRANTS=1 after the box is told.
version = "3.8.5"
platforms.linux-x64 = { asset_pattern = "secrets-x86_64-unknown-linux-gnu.tar.gz" }

# The agent-secrets client and host helper (AGENTC-393), from sjawhar/legion's legion-envoy-v*
# release: its linux agent-secrets tarballs ship bin/agent-secrets and bin/agent-secrets-helper,
# its darwin ones bin/agent-secrets alone (the helper builds for Linux only), and
# the alias keeps it apart from the plain "github:sjawhar/legion" CLI entry above (a different
# tag series and install dir; both measured side by side on mise 2026.8.10). The helper runs
# this pin from its user unit (only where installers/agent-secrets.sh set it up: devbox/install.sh,
# or the root install.sh where env.local names a broker), and installers/agent-secrets.sh restarts it
# on a bump only when no host session is registered. A restart keeps the enrollment and the
# grants of a live session that the running helper recorded with its key (a session registered
# with --session-id), and revokes those of every other live session (installers/agent-secrets.sh).
# The release is mutable, so each asset's sha256 is pinned: a replaced asset fails to install.
# From legion-envoy-v3.17.1 on the release also carries a build attestation (release-envoy-listener.yaml
# on main), which mise verifies on install; check it by hand with
# `gh attestation verify agent-secrets-amd64.tar.gz --repo cybermonklabs/legion --cert-identity
# https://github.com/cybermonklabs/legion/.github/workflows/release-envoy-listener.yaml@refs/heads/main
# --source-ref refs/heads/main --deny-self-hosted-runners` (`--repo` alone accepts an attestation
# from any workflow run in the repository). The owner must be cybermonklabs, not sjawhar: the
# repository moved and GitHub redirects every READ, so the old name still resolves for the API and
# for git, but the attestation's own certificate names cybermonklabs. With the old name even
# `--repo sjawhar/legion` alone fails, and its error ("verifying with issuer sigstore.dev") names
# neither the owner nor the identity, so it reads as a broken attestation rather than a stale name.
# Measured 2026-11-11 on legion-envoy-v29.54.0: sjawhar fails, cybermonklabs exits 0.
# The digests are the ones
# GitHub recorded at upload; bump them with the version
# (gh api repos/cybermonklabs/legion/releases/tags/<tag> --jq '.assets[] | .name, .digest').
[tools.agent-secrets]
version = "legion-envoy-v34.12.0"  # The same release as the production secrets broker's pin in theorem-labs/agent-infra#5156 (tag commit e9cc79a3bc148ed8e456f5fdfb162f4e0d9fb1d9). It holds cybermonklabs/legion#4595 (merge 118ec6e6bf4afc61315ce22f66a5618a0bb84da0), with which the broker serves named credential profiles and every GitHub App token is a profile's; #5063 (merge 3893b22585d39c5e0502d411dc116f3d83bac89f), the sign-in renewal fix: `agent-secrets` passes over a sign-in this machine cannot renew once its enrollment ends; #4696 (merge e96f1420b413e13fc13fc6b4b9e75fa8e6315c63), which reads a token endpoint's answer by its HTTP status alone; #4769 (merge 798e1d223b80748a6aa08c67f06337ff8a7ef1f3), with which a sign-in its issuer ended is final; and #5142 (merge 4f62e4ac7e0d2713950afba55575117045cb73c5), with which the broker's airlock refuses the IPv4-translated and ISATAP forms of a refused IPv4 address. #5142 changes the broker alone: between legion-envoy-v34.11.3 and this release no package the client or the helper builds from changed, nor go.mod or go.sum (`go list -deps ./cmd/cipher ./cmd/cipher-helper`, 32 packages of the module). This client exits 2 and sends nothing for `--github-owner`, `--github-repo`, `--github-read-only` and `--github-token`, and a broker that holds #4595 refuses the request field those flags made a client before it send (GITHUB_APP_FIELD_REMOVED). The `--target` that replaces them needs a broker that serves profiles: a broker from before #4595 (production runs legion-envoy-v33.7.0 until #5156 is applied) releases the whole profile without the target, and this client then exits 2 ("the broker is too old for --target") and runs nothing. So this pin moves only with its callers, at #5156's apply: scripts/secret-run passes `--target` through, and shims/gh-app-token asks for GITHUB_APP_<PERSON>_READ (--read-only) or GITHUB_APP_<PERSON>, narrowed with `--target`. The helper moves with the client at that apply: a helper from before `--target` signs a targeted request without its target, and this client refuses that request before it sends it ("restart the helper so it runs this release"), so until the helper restarts, gh-app-token's --repo and --read-only fail in a host session. installers/agent-secrets.sh restarts it with AGENT_SECRETS_HELPER_RESTART_WITH_SESSIONS=1, which keeps each live session that the running helper recorded with its key. This client also works against a legion-envoy-v34.3.0 broker: the one broker route it calls that legion-envoy-v34.3.0's client did not, GET /v1/enrollments/self, is served from legion-envoy-v33.7.0 on. Checked between legion-envoy-v32.28.1 and this release: `agent-secrets identity` keeps its exit codes (0 with an identity on disk or a helper session, 1 without, 2 on a usage error), so scripts/secret-run's choice is unchanged; `agent-secrets NAME -- command` takes its broker identity from the same four sources (a launcher's key directory, the person's own `agent-secrets login`, the helper, the machine's own cloud identity); a GitHub profile whose github.value is "installations" still puts {"installations": {<login>: {"installation_id", "token", "expires_at"}}} in the command's environment, which shims/gh-app-token reads; the two notices the client prints while a box's launcher is still enrolling it are the ones shims/gh-app-token skips (CLIENT_ENROLLMENT_NOTICES); and no line of code that names ENROLL_FAILED, DRAINING or UNENROLL_FAILED changed (packages/envoy/internal/cipher/helper/protocol.go, cmd/cipher, internal/cipherclient). Before a later bump, make sure that these three codes still have that meaning. The linux tarballs still ship bin/agent-secrets and bin/agent-secrets-helper. Earlier reasons that still apply: #4512 (merge c980d91b540ece46364256983f24a3f5a63b3841), which answers a secret reread that carries no proof with 202, which a client before legion-envoy-v32.24.3 reads as a refusal; #4151 (merge 1a8990fa007037ce7080de928a17bd8efa4d7507): `agent-secrets register` without --exec refuses a helper answer that names no root_pid, which every helper before #4151 gives, which is one more reason the helper moves with the client; INFRA-3845 (merge bb4b0c95e0f877b35c3eb9b867d4c964ce79739b), which gave `agent-secrets NAME -- command` those four sources, so it works in a process the helper never saw; INFRA-3823 (merge f35483e5103e688559150dd07b59459c27951926) and INFRA-3844 (merge 467e5371b5f2d65dc207b13d5655c49b163af88c): `agent-secrets secret create` refuses before it asks, and every `agent-secrets secret` form takes its store credential from the environment, with no --profile flag. INFRA-3648 (merge 35d0212bb3eba3e131c3ad04461e7ca915e5b57f), with which the helper answers `enroll --helper`, `unenroll --helper` and the machine login call with the broker's outcome, and answers that the outcome is not known (ENROLL_OUTCOME_UNKNOWN, UNENROLL_OUTCOME_UNKNOWN, or LOGIN_FAILED with an error that says so) when the broker possibly got the request and its answer did not come back. `scripts/agentbox` reads the client's ENROLL_FAILED and DRAINING codes at each enroll call (enroll_attempts) as the only known enroll failures, and UNENROLL_FAILED (unenroll_revoke) as the only known unenroll failure. It reads every other failure as an outcome that is not known. Also INFRA-3666 (merge df57176f7203463733cca417caf502d23ff60fa9) and the secrets broker's airlock (merge 46c4162b, INFRA-1352; INFRA-1355, INFRA-3012). The helper itself moves to a new version only when it restarts.
platforms.linux-x64   = { asset_pattern = "agent-secrets-amd64.tar.gz", checksum = "sha256:c11846c6dde4ff0a5223879b8a36eb56e605febad49230c0ac66316bc10a8691" }
platforms.linux-arm64 = { asset_pattern = "agent-secrets-arm64.tar.gz", checksum = "sha256:32e3e3800707ff9621620867cc61241ec268a103f4e077cd10bebd225120a082" }
platforms.macos-x64   = { asset_pattern = "agent-secrets-darwin-amd64.tar.gz", checksum = "sha256:3808a004f79eaa0fe155b40a531d36b829fe6d4b0152e6dcfa1129c68ef8cddb" }
platforms.macos-arm64 = { asset_pattern = "agent-secrets-darwin-arm64.tar.gz", checksum = "sha256:6ebf137e6872193b768c6d534ccf249374ab9c5be66980928c9dade1a2317ffa" }

