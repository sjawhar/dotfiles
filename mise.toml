# Global mise tool configuration
# Symlinked to ~/.config/mise/config.toml
# All versions pinned for reproducibility

[settings]
# Agent shells set CI=true (omp's bash tool; Claude Code too), and under CI mise
# trusts every checkout's config and runs its [env] values, PYTHONPATH
# sitecustomize and _.source scripts through any shim (python3, sops, age...) the
# moment a tool is called there. paranoid turns off that automatic trust,
# including in CI, so an untrusted config fails closed ("Config files ... are not
# trusted") instead of running (dispatch://INFRA-5432, decision
# dispatch://INFRA-5432/comment/63a722b9-7872-4476-ab40-27fdfa49386b). Measured
# 2026-11-23 on mise 2026.10.11: only the boolean form parses here -- the
# paranoid = ["config"] category list the docs describe fails with "invalid type:
# sequence, expected a boolean", and the string and MISE_PARANOID=config env forms
# fail too (category selection needs a newer mise). = true turns on paranoid's
# checks, not just config trust: a project config is refused unless its content is
# trusted (CI no longer auto-trusts, trust binds to the file's hash, and
# .tool-versions and idiomatic version files need trust too); a community
# asdf/vfox plugin installed by short name is refused; install-time provenance is
# re-verified; and a remote include must be pinned to a full commit sha. Config
# trust is the check the threat needs; the rest add defence our trusted paths and
# pinned tools already satisfy. A shim in an untrusted checkout then exits
# non-zero rather than running its env; a bare /usr/bin/python3 is unaffected.
# global-only (a cloned repo cannot turn it off).
paranoid = true
# The checkout roots whose configs mise trusts by path, without a content hash, so
# our own repos keep resolving tools under paranoid. mise trusts a config at or
# below these paths and has no glob support (it compares each entry with the
# config's canonical path), and our worktrees are arbitrary-named flat siblings
# under ~/src, so these are the working roots, not per-repo leaves. A 2026-11-23
# census found outside clones under ~/src (upstream mirrors agents read) but none
# carries a mise config, so nothing untrusted loads from them today. The residual:
# no control at mise 2026.10.11 stops an outside clone under ~/src that carries a
# mise config from being trusted by path (ignored_config_paths set in the global
# miserc is lifted by a clone's own .miserc.toml; only MISE_IGNORED_CONFIG_PATHS,
# naming known paths, holds). The remedies that hold are cloning such a repo
# outside the trusted roots, where it fails closed, or MISE_IGNORED_CONFIG_PATHS
# for a named clone (dispatch://INFRA-5432). Deliberately NOT ~/ or the /mnt
# scratch roots: a clone or tarball opened outside these paths stays untrusted.
# This REPLACES the MISE_TRUSTED_CONFIG_PATHS export .bashrc used to set; mise
# reads this global setting now, and its env var (precedence rank 2) would have
# overridden this config (rank 4) had both been left set. global-only.
trusted_config_paths = ["~/.dotfiles", "~/.worktrees", "~/src"]
# 14d soak for third-party releases. The mise default (24h) let an accidental
# blanket `mise upgrade --bump` (2026-08-25) pull bun 1.4.0 at 5 days old and
# non-LTS node 26. Exact pins bypass this filter, so deliberate fresh installs
# still work; only fuzzy resolution (latest / --bump) waits out the window.
minimum_release_age = "14d"
# My own repos are exempt from the release-age filter. That delay exists so a
# third-party compromise has time to surface before I install it, which buys
# nothing for code my own attested CI just built. mise verifies GitHub build
# provenance on install for every release that carries an attestation (the
# agent-secrets releases from legion-envoy-v3.17.1 on); [tools.agent-secrets]
# below also pins its assets' digests, because its release is mutable.
# Third-party tools keep the filter. secretsd matters most here: its daemon and
# client ship together, so a fix cannot reach a machine at all until the
# release is installable.
# mise matches these entries EXACTLY -- a "github:sjawhar/*" glob is accepted
# and then silently ignored -- so a new repo of mine has to be added by hand.
# Alias short names sit beside their backend ids because either form can be
# requested (`mise exec -- forward`, `[tools.tt]`).
minimum_release_age_excludes = [
  "github:sjawhar/ctx-memory",
  "github:sjawhar/forward",
  "github:sjawhar/jj",
  "github:sjawhar/knives",
  "github:sjawhar/legion",
  "github:sjawhar/mailbox",
  "github:sjawhar/oh-my-pi",
  "github:sjawhar/secretsd",  # archived; tags predate the forward merge
  "github:sjawhar/tmux-builds",
  "forward",
  "secrets",
  "agent-secrets",
]
# The global `rust` pin below makes mise export RUSTUP_TOOLCHAIN, which overrides
# every repo's own rust-toolchain.toml. oh-my-pi pins nightly-2026-08-12; under
# the override its natives build dies (E0554 #![feature] on stable) and `bun check`
# reports rustfmt drift in untouched vendored crates -- five agents hit it on
# 2026-09-22. Reading rust-toolchain.toml as an idiomatic version file keeps 1.98.0
# everywhere else and the repo's own pin inside such a repo (verified: rustc
# 1.99.0-nightly in oh-my-pi, 1.98.0 in agent-c).
idiomatic_version_file_enable_tools = ["rust"]

[settings.upgrade]
auto_prune = false

# The global `go` pin below made mise export GOROOT (its 1.27.0 install dir) into every shell and
# every mise shim, python3 included. A GOROOT in the environment overrides the root each Go
# toolchain finds from its own executable, so every other toolchain used 1.27.0's tree: a
# module's pinned go run directly failed with `compile: version "go1.27.0" does not match go tool
# version "go1.26.8"` (agent-infra), and legion's check-ci-filters.sh, which finds its toolchain
# with `go env GOROOT`, reported 1,485 false errors (both measured 2026-11-17). Go needs no
# GOROOT: mise's go and each toolchain it switches to find their own.
[settings.go]
set_goroot = false

# mise's GitHub API calls (release lookups) need a token: this box exhausts the shared 60/h
# anonymous limit. gh-app-token mints the box's GitHub App installation token, which lives one
# hour, so it is fetched per mise run here rather than exported once by .bashrc, where a
# days-old session held an expired token. A failed command falls back to gh's own login.
[settings.github]
credential_command = "gh-app-token agent --owner sjawhar"

# shims/ first in every PATH mise builds: `mise exec`, `mise env`, and each mise shim, which runs
# its tool with mise's tool dirs put ahead of the caller's PATH. omp starts its Python eval kernel
# through mise's python3 shim, so that kernel found mise's own gh before shims/gh, and on
# 2026-11-02T00:07Z an eval cell's `gh pr review --approve` ran on the user's login and approved a
# pull request as him (omp/extensions/session-env.ts, GH_CONFIG_DIR). The user's own shells already
# put shims/ first, so they see no change.
[env]
_.path = ['{{ env.DOTFILES_DIR | default(value=env.HOME ~ "/.dotfiles") }}/shims']

[tools]
"github:sjawhar/jj" = "0.46.0-sami.20261125-112159"  # upstream 0.46.0 + gitattr filter drivers (jj-vcs/jj#8719, LFS) + #10097 + #10130 + #10159 + #10160 + #10163 + #10164 + #10166 + sparse paths skip-worktree in colocated Git indexes + chunked pack mapping (sjawhar/jj#3: gix-pack maps packs in 8 MiB chunks under a 512 MiB budget, JJ_PACK_MAPPED_LIMIT) + sjawhar/jj#4 (a merge of two commits with more than one merge base keeps what both sides hold; 20261120-120102 silently dropped it, jj-vcs/jj#6369); #10129 and #10127 dropped. cybermonklabs/legion's CI and worker image run this same release (cybermonklabs/legion#4565, .github/ci-tools.yaml)
"github:sjawhar/knives" = "6.1.11"  # keep equal to the plugin tag in omp/plugins/package.json: the plugin runs whichever binary this installs
"github:sjawhar/legion" = "legion-v10.3.0"  # the Go `legion` CLI on an agent session's PATH outside a Legion pane (a pane puts its daemon's own <state_dir>/bin/legion first); it shares the Go daemons' registry, ~/.local/state/legion/legions.json, which a TypeScript cli-v* `legion` would rewrite as an object no Go daemon can read. Speaks daemon API contract 17 (with @sjawhar/pi-legion 8.5.0): `legion controller start` refuses a daemon or a pi-legion of another contract
# omp daily driver: fork releases built from the sami branch; the wrapper execs this.
# upgrade.auto_prune=false below keeps replaced versions installed - live sessions still exec
# them for hub/worker spawns.
#
# v18.18.6-sami.20261119-162325 (commit b40fd3c3), the build dispatch://INFRA-4638 pins for INFRA's
# pods, carries 230bc2fa (cybermonklabs/oh-my-pi#48, dispatch://INFRA-4512): after a classifier
# refusal, no fallback in the same turn sends the request again to the model that refused it, by
# any name, route or provider, and the walk keeps its retry budget and provider exclusion past a
# spent fallback. The pin before it, v18.18.6-sami.20261117-053702, lacked it, and new sessions
# multiplied OpenAI cyber_policy refusals (dispatch://INFRA-1484). Over 053702 it also brings: the
# fallback walk passes over a model in cooldown or with spent usage (#19); a turn whose `!command`
# key prints nothing is retried, and `--restore` continues it (#22); subagents share Hindsight's
# recall pause (#28); `--session-id <uuid>`; model discovery yields the event loop every 10 ms; and
# fixes to the shell builtins (rm, mv, find, grep), the directory walker and robomp. Its session-store
# changes (SQL leases, PostgreSQL writes opened read-write) apply only under `session.storage: sql`,
# which no config here sets, and its `secrets.maskSessionStore` is off by default. A `!command` value
# now runs in a session of its own with no terminal; scripts/gateway-token and
# scripts/gcloud-token-fast each print a token so (measured 2026-11-21). It keeps the 11-17 probe fix
# (dispatch://INFRA-4027), the 11-10 memory-leak fix (dispatch://INFRA-1876) and setup version 3.
# The linux-x64 asset (sha256 9fd84e4ff44cddef87f323100e5cb30ca235284033c8a05192f90c69481fea68) is
# smoke-tested: `omp --version` gives omp/18.18.6 and `omp --smoke-test` gives `smoke-test: ok`.
# packages/mnemopi changed only to keep mnemopi's state under OMP_CONFIG_ROOT when that is set, and
