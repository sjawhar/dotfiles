# Chat hub homeserver (docs/plans/2026-10-03-chat-hub-design.md). Machine paths come
# from chathub/tuwunel-serve as -O overrides.
[global]
# Host-independent, so IDs (@sami:chathub) survive moving the hub to another machine.
server_name = "chathub"
# Loopback only: the bridges, inboundd and agents' matrix-mcp all run on the hub
# machine, and the access token acts as Sami on every chat network (HOME-104).
address = ["127.0.0.1"]
port = 8008
# One user, created by chathub/bootstrap-user; nobody registers.
allow_registration = false
# A private hub: it never talks to other Matrix servers.
allow_federation = false
trusted_servers = []
# Agents read portal rooms through matrix-mcp, which has no E2EE; bridges keep
# encryption off too.
allow_encryption = false
new_user_displayname_suffix = ""
# Version 12 (Tuwunel's default since 1.9.2) derives a room's ID from a hash of its
# create event, so two bridge portals created in the same instant got one room:
# on 2026-10-03 Signal's "Tam" chat was merged into Daniel Ziegler's. Version 11
# rooms get random IDs. Its one loss, v12's undemotable room creator, is moot on a
# single-user hub.
default_room_version = "11"
