# Devbox role on devbox-agents-2, whose `hostname -s` is devbox-sami: that is
# the name installers/forward.sh selects this file by. Fields mean what
# config-serve.toml says. It pairs with the laptop's forward-daemon@devbox-sami
# (config-daemon-devbox-sami.toml) over tailnet IPv4, because agent boxes have
# no IPv6 route. The laptop's default ports belong to sami-agents on IPv4 and
# oryx on IPv6, so every port the laptop listens on moves to 1281x. The URL
# channel has no config key: channel-nat-devbox-sami.service redirects this
# host's and its boxes' 100.100.92.97:12800 to the pair's 12810.
listen = "100.111.252.63"
peer = "100.100.92.97"

bridge_port = 12801
forward_ttl_secs = 300
relay_port = 12813
pcsc_port = 12814
pulse_port = 12816
