# Laptop role, sami-leanperf pair: run by forward-daemon@sami-leanperf.service.
# sami-leanperf is off the tailnet, so this daemon listens on loopback and
# forward-tunnel@sami-leanperf.service carries every channel over SSH (Host
# sami-leanperf-tunnel in ~/.ssh/config.local). The other pairs hold the
# laptop's tailnet addresses, so forward's default ports are free here. Tunnelled
# connections arrive from 127.0.0.1, which any local process shares.
listen = "127.0.0.1"
peer = "127.0.0.1"
bridge_port = 12801

# Same policy as config.toml (scripts/tests/test_forward_environment.py fails if
# they drift), except the preview host: this pair's is the tunnelled 12802, pinned
# to that port because a bare loopback entry would open any laptop-local URL.
mode = "allowlist"
opener = ["/usr/bin/xdg-open"]
clipboard = ["wl-copy"]
allow = [
  "*.anthropic.com",
  "127.0.0.1:12802",
  "accounts.google.com",
  "auth.openai.com",
  "claude.ai",
  "d-9267c4f5db.awsapps.com",
  "device.sso.*.amazonaws.com",
  "github.com",
  "oidc.us-west-2.amazonaws.com",
  "production-trajectory-labs.auth.us-west-2.amazoncognito.com",
  "staging-trajectory-labs.auth.us-west-2.amazoncognito.com",
  "viewer.hawk.internal.trajectorylabs.com",
]
