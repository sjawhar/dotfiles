# Laptop role, sami-leanperf pair: run by forward-daemon@sami-leanperf.service.
# Fields and URL policy are explained in config-daemon-oryx.toml. This pair is
# carried over an SSH tunnel to the VM, so the daemon listens on
# loopback and forward-tunnel@sami-leanperf.service carries every channel (Host
# sami-leanperf-tunnel in ~/.ssh/config.local). oryx's pair holds the laptop's
# tailnet address, so forward's default ports are free on 127.0.0.1 here.
# Tunnelled connections arrive from 127.0.0.1, which any local process shares.
listen = "127.0.0.1"
peer = "127.0.0.1"
bridge_port = 12801

# Same policy as config-daemon-oryx.toml, except the preview host: this pair's is
# the tunnelled 12802, pinned to that port because a bare loopback entry would
# open any laptop-local URL.
mode = "allowlist"
opener = ["/usr/bin/xdg-open"]
clipboard = ["wl-copy"]
allow = [
  "*.anthropic.com",
  "127.0.0.1:12802",
  "accounts.google.com",
  "auth.openai.com",
  "claude.ai",
  "d-9267c4f5db.awsapps.com",
  "device.sso.*.amazonaws.com",
  "github.com",
  "oidc.us-west-2.amazonaws.com",
  "production-trajectory-labs.auth.us-west-2.amazoncognito.com",
  "staging-trajectory-labs.auth.us-west-2.amazoncognito.com",
  "viewer.hawk.internal.trajectorylabs.com",
]
