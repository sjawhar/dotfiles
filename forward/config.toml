# Listed URLs open straight in the browser. Everything else fires a critical
# notification and lands in the clipboard, so it costs one paste and cannot open
# by itself. Allowlist was unusable before forward learned that handoff, because
# unlisted URLs were dropped silently. COSMIC renders no notification buttons, so
# there is no ask-me-first option on this machine; paste is the gate.
mode = "allowlist"

# Use the system opener on the laptop: bare xdg-open resolves to the dotfiles
# shim, which re-enters `forward open` and creates an opener feedback loop.
opener = ["/usr/bin/xdg-open"]

# COSMIC notifications are not clickable, so non-allowlisted URLs are handed over via clipboard.
clipboard = ["wl-copy"]

# Laptop role: forward daemon. listen is this machine's literal tailnet address,
# bound by the daemon and compared against by nothing; peer is the devbox's
# literal tailnet address, compared against every inbound connection and dialled
# for nothing on this side. Literal addresses only — a MagicDNS name is mutable
# from the admin console and must never sit inside a security decision.
listen = "100.100.92.97"
peer = "100.113.243.90"
bridge_port = 12801

# Entries are the only remote URLs that open without a paste. Chosen from 14 days
# of daemon logs, so routine traffic does not turn into constant pasting.
allow = [
  "100.113.243.90:12802",         # Devbox file-preview server; must match the devbox's `listen`
  "d-9267c4f5db.awsapps.com",      # Trajectory's IAM Identity Center tenant; deliberately not wildcarded
  "device.sso.*.amazonaws.com",    # AWS device-authorization endpoints
  "github.com",                    # Whole host, not just /login: PR and issue links are the single
                                   # largest source of opens, and a github.com page cannot phish a
                                   # credential any more than browsing there yourself can. User
                                   # content lives on other hosts (gist., raw.githubusercontent.)
  "accounts.google.com",           # Google OAuth sign-in
  "auth.openai.com",               # Codex / OpenAI sign-in
  # hawk login Cognito hosted UI, one host per Hawk environment, pinned rather than
  # wildcarded: `*.auth.us-west-2.amazoncognito.com` would admit every AWS tenant's
  # hosted UI in the region. Each host is the `authorization_endpoint` the Hawk API
  # itself reports at `https://<HAWK_API_URL>/auth/config`, which is what the CLI
  # opens; read it there when a new environment appears, because the deployed
  # domains do not match the current `cognito_domain_prefix` template in Hawk's
  # infra (`infra/hawk/cognito.py`).
  "production-trajectory-labs.auth.us-west-2.amazoncognito.com",  # api.hawk.internal.trajectorylabs.com
  "staging-trajectory-labs.auth.us-west-2.amazoncognito.com",     # api.hawk.staging.trajectorylabs.com
  "claude.ai",                     # Claude web authentication
  "*.anthropic.com",               # Anthropic-owned subdomains used by authentication
]
