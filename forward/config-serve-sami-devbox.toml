# Devbox role on sami-devbox, the Google Cloud VM that replaces sami-rocqperf and
# sami-leanperf (dispatch://INFRA-993). Fields mean what config-serve-oryx.toml
# says; the pair is carried over an SSH tunnel to the VM, as
# config-serve-sami-leanperf.toml describes (forward-tunnel@sami-devbox, Host
# sami-devbox-tunnel). Oryx's tunnel pair holds 127.0.0.1 with the default
# ports and sami-rocqperf holds 127.0.0.2, so this pair takes 127.0.0.3 at both
# ends: preview URLs name 127.0.0.3:12802. The laptop dials the bridge and grant
# feed at its 127.0.0.1 peer, where oryx's pair uses 12801 and the default grant
# port and sami-rocqperf's uses 12811 and 12815, so these two move to 12821 and
# 12825. sshd makes the far-end connection from 127.0.0.1, so that is the peer,
# and any process on this VM can reach these channels the way the laptop does.
listen = "127.0.0.3"
peer = "127.0.0.1"

bridge_port = 12821
grant_port = 12825
forward_ttl_secs = 300
