# Laptop role, devbox-sami pair (devbox-agents-2): run by
# forward-daemon@devbox-sami.service beside the default pair's daemon and
# oryx's. forward trusts exactly one peer per daemon, so each devbox gets its
# own. This one shares the default pair's IPv4 address (agent boxes cannot
# reach the laptop over IPv6), so every port it listens on moves to 1281x:
# relay, pcsc and pulse here, the URL channel through --port 12810 in
# forward-daemon@devbox-sami.service.d/. Literal addresses only, for the
# reason config.toml gives.
listen = "100.100.92.97"
peer = "100.111.252.63"
bridge_port = 12801
relay_port = 12813
pcsc_port = 12814
pulse_port = 12816

# Same policy as config.toml (scripts/tests/test_forward_environment.py fails if
# they drift), except the preview host: this pair's is devbox-agents-2.
mode = "allowlist"
opener = ["/usr/bin/xdg-open"]
clipboard = ["wl-copy"]
allow = [
  "*.anthropic.com",
  "100.111.252.63",
  "accounts.google.com",
  "auth.openai.com",
  "claude.ai",
  "d-9267c4f5db.awsapps.com",
  "device.sso.*.amazonaws.com",
  "github.com",
  "oidc.us-west-2.amazonaws.com",
  "production-trajectory-labs.auth.us-west-2.amazoncognito.com",
  "staging-trajectory-labs.auth.us-west-2.amazoncognito.com",
  "viewer.hawk.internal.trajectorylabs.com",
]
