# Laptop role, oryx pair: run by forward-daemon@oryx.service. forward trusts
# exactly one peer per daemon, so each devbox gets its own daemon. This file is
# the reference for every config-daemon-*.toml: the fields and the URL policy are
# explained here once, and the other pairs say only how they differ.
#
# listen is this machine's literal address for the pair, bound by the daemon and
# compared against by nothing; peer is the devbox's literal address, compared
# against every inbound connection and dialled for nothing on this side. Literal
# addresses only: a MagicDNS name is mutable from the admin console and must never
# sit inside a security decision. oryx's pair rides forward-tunnel@oryx, one SSH
# connection through Cloudflare Access that carries forward's default ports to the
# same ports on the far side's loopback, so both addresses are 127.0.0.1 (the
# other tunnel pairs do the same on 127.0.0.2 and 127.0.0.3). bridge_port is the
# devbox's OAuth callback bridge port,
# which this side dials; config-serve-oryx.toml explains the bridge.
listen = "127.0.0.1"
peer = "127.0.0.1"
bridge_port = 12801

# URL policy, the same for every pair (scripts/tests/test_forward_environment.py
# fails if the pairs drift), except the preview host: each pair allows its own
# devbox's. An IPv6 host is matched with its brackets, as the URL spells it.
#
# Listed URLs open straight in the browser. Everything else fires a critical
# notification and lands in the clipboard, so it costs one paste and cannot open
# by itself. Allowlist was unusable before forward learned that handoff, because
# unlisted URLs were dropped silently. COSMIC renders no notification buttons, so
# there is no ask-me-first option on this machine; paste is the gate.
mode = "allowlist"

# Use the system opener on the laptop: bare xdg-open resolves to the dotfiles
# shim, which re-enters `forward open` and creates an opener feedback loop.
opener = ["/usr/bin/xdg-open"]

# COSMIC notifications are not clickable, so non-allowlisted URLs are handed over
# via clipboard.
clipboard = ["wl-copy"]

# Entries are the only remote URLs that open without a paste. Chosen from 14 days
# of daemon logs, so routine traffic does not turn into constant pasting.
allow = [
  "*.anthropic.com",
  "127.0.0.1:12802",
  "accounts.google.com",
  "auth.openai.com",
  "claude.ai",
  "d-9267c4f5db.awsapps.com",
  "device.sso.*.amazonaws.com",
  "github.com",
  "oidc.us-west-2.amazonaws.com",
  "production-trajectory-labs.auth.us-west-2.amazoncognito.com",
  "staging-trajectory-labs.auth.us-west-2.amazoncognito.com",
  "viewer.hawk.internal.trajectorylabs.com",
]
