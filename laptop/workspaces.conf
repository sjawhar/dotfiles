# Global workspace map (AeroSpace-style): drives generate-shortcuts.
# Columns: <global-ws> <fallback-list> <switch-chord> <move-chord>
# fallback-list is comma-separated with no spaces. Its queries are tried in order against
# connected monitors: exact connector name first, then case-insensitive model substring.
# The first connected match wins. For identical monitors, use connector names (for example
# DP-1/DP-2) because an ambiguous model match is rejected rather than chosen arbitrarily.
# Local workspace index is the order of rows resolved to each connected monitor.
# If fallbacks resolve more than 10 rows to one monitor, later rows are skipped with
# a warning because COSMIC's workspace key encoding has a 10-slot cap.
# workspace-shortcuts.path re-runs laptop/generate-shortcuts --apply automatically
# whenever cosmic-comp's output state or this file changes.

# Sceptre bottom ultrawide at home; Dell P3425WE / LG WQHD ultrawide in offices (1-3)
1   O34,P3425WE,WQHD,eDP-1  Alt+1       Alt+Shift+1
2   O34,P3425WE,WQHD,eDP-1  Alt+2       Alt+Shift+2
3   O34,P3425WE,WQHD,eDP-1  Alt+3       Alt+Shift+3

# AOC top ultrawide at home; road top-landscape Xebec is DP-2 (4-6)
# (offices have no top screen: DP-2/WQHD land these on the office ultrawide as locals 4-6)
4   U34G2G4R3,DP-2,WQHD,eDP-1  Alt+4       Alt+Shift+4
5   U34G2G4R3,DP-2,WQHD,eDP-1  Alt+5       Alt+Shift+5
6   U34G2G4R3,DP-2,WQHD,eDP-1  Alt+6       Alt+Shift+6

# Portrait left: Samsung at home; InnoView on the road; travel-office 4K is DP-4
# (twin U2725QEs: model ambiguous, so connectors); LG-office 4K is the U3223QE (7-8)
# (portraits before MB16AC: if the ASUS is also connected it falls through to 11-13)
7   LS32A70,InnoView,DP-4,U3223QE,MB16AC,eDP-1  Alt+7       Alt+Shift+7
8   LS32A70,InnoView,DP-4,U3223QE,MB16AC,eDP-1  Alt+8       Alt+Shift+8

# Portrait right: Samsung at home; road Xebec is DP-1; travel-office 4K is HDMI-A-1
# (after DP-1: HDMI-A-1 is the InnoView in the road kit); LG-office 4K is the P3222QE
# (before DP-1: in the LG office DP-1 is the LEFT portrait, U3223QE) (9-10)
9   U32J59x,P3222QE,DP-1,HDMI-A-1,eDP-1  Alt+9       Alt+Shift+9
10  U32J59x,P3222QE,DP-1,HDMI-A-1,eDP-1  Alt+0       Alt+Shift+0

# ASUS bottom; falls back to the laptop when the ASUS is absent (11-13)
11  MB16AC,eDP-1  Super+Alt+1  Super+Alt+Shift+1
12  MB16AC,eDP-1  Super+Alt+2  Super+Alt+Shift+2
13  MB16AC,eDP-1  Super+Alt+3  Super+Alt+Shift+3

# Laptop (14-15)
14  eDP-1      Super+Alt+4  Super+Alt+Shift+4
15  eDP-1      Super+Alt+5  Super+Alt+Shift+5
