# Global workspace map (AeroSpace-style): drives generate-shortcuts.
# Columns: <global-ws> <fallback-list> <switch-chord> <move-chord>
# fallback-list is comma-separated with no spaces. Its queries are tried in order against
# connected monitors: exact connector name first, then case-insensitive model substring.
# The first connected match wins. For identical monitors, use connector names (for example
# DP-1/DP-2) because an ambiguous model match is rejected rather than chosen arbitrarily.
# A query may end in '?' ("MB16AC?") to match only when that monitor holds no rows
# from a different fallback list, so a screen that already won another chord group
# yields to the next query instead of absorbing these rows too.
# A query may carry '!ABSENT' ("MB16AC!InnoView") to match only while no connected
# monitor matches ABSENT, for a screen whose role depends on what else is on the desk.
# A row's local slot is its order among the rows resolved to the same monitor; the chord
# addresses that slot by number, so Alt+3 lands in the same place when slots 1-2 are empty.
# If fallbacks resolve more than 10 rows to one monitor, later rows are skipped with
# a warning because COSMIC's workspace key encoding has a 10-slot cap.
# workspace-shortcuts.path re-runs laptop/generate-shortcuts --apply automatically
# whenever cosmic-comp's output state or this file changes.

# Sceptre bottom ultrawide at home; Dell P3425WE / LG WQHD ultrawide in offices;
# LG ULTRAWIDE (144Hz) in the hybrid kit (1-3)
1   O34,P3425WE,WQHD,ULTRAWIDE,eDP-1  Alt+1       Alt+Shift+1
2   O34,P3425WE,WQHD,ULTRAWIDE,eDP-1  Alt+2       Alt+Shift+2
3   O34,P3425WE,WQHD,ULTRAWIDE,eDP-1  Alt+3       Alt+Shift+3

# AOC top ultrawide at home; road top-landscape Xebec is DP-2 (4-6)
# (offices have no top screen: the Dell P3425WE and LG WQHD office ultrawides take these
# as locals 4-6; DP-2? skips a DP-2 that already won 1-3, like the hybrid-kit
# LG ULTRAWIDE; the ASUS takes them unless the InnoView is connected, in which
# case the ASUS is a portrait (9-10); else the laptop)
4   U34G2G4R3,P3425WE,DP-2?,WQHD,MB16AC!InnoView,eDP-1  Alt+4       Alt+Shift+4
5   U34G2G4R3,P3425WE,DP-2?,WQHD,MB16AC!InnoView,eDP-1  Alt+5       Alt+Shift+5
6   U34G2G4R3,P3425WE,DP-2?,WQHD,MB16AC!InnoView,eDP-1  Alt+6       Alt+Shift+6

# Portrait left: Samsung at home; LG-office 4K is the U3223QE; twin-U3225QE desk
# left 4K is DP-8 (twins, so connectors; DP-8? and after U3223QE because the
# LG-office dock once put its RIGHT P3222QE on DP-8); travel-office 4K is DP-4
# (twin U2725QEs); a lone Dell U3225QE on HDMI-A-1 at the LG-ultrawide desk;
# InnoView on the road, where it is HDMI-A-1 or DP-1 (at that desk it is the
# bottom row, 11-13) (7-8)
# (portraits before MB16AC: if the ASUS is also connected it falls through)
7   LS32A70,U3223QE,DP-8?,DP-4,HDMI-A-1,InnoView,MB16AC,eDP-1  Alt+7       Alt+Shift+7
8   LS32A70,U3223QE,DP-8?,DP-4,HDMI-A-1,InnoView,MB16AC,eDP-1  Alt+8       Alt+Shift+8

# Portrait right: Samsung at home; LG-office 4K is the P3222QE; twin-U3225QE desk
# right 4K is DP-4 (DP-4? skips the travel-office DP-4, which already won 7-8);
# hybrid-kit ASUS (MB16AC? skips it when it already won another group); road
# Xebec is DP-1; travel-office 4K is HDMI-A-1 (after DP-1: HDMI-A-1 is the
# InnoView in the road kit) (9-10)
9   U32J59x,P3222QE,DP-4?,MB16AC?,DP-1,HDMI-A-1,eDP-1  Alt+9       Alt+Shift+9
10  U32J59x,P3222QE,DP-4?,MB16AC?,DP-1,HDMI-A-1,eDP-1  Alt+0       Alt+Shift+0

# Bottom row: hybrid-kit Xebec (DP-1? skips a DP-1 that already won portrait
# rows: the road kit's right Xebec and the LG-office left 4K); home bottom
# InnoView under the Sceptre (InnoView? skips it when it already won 7-8 on the
# road); the ASUS, except at the U3225QE desks where it is a portrait or takes
# 4-6; else the laptop (11-13)
11  DP-1?,InnoView?,MB16AC!U3225QE,eDP-1  Super+Alt+1  Super+Alt+Shift+1
12  DP-1?,InnoView?,MB16AC!U3225QE,eDP-1  Super+Alt+2  Super+Alt+Shift+2
13  DP-1?,InnoView?,MB16AC!U3225QE,eDP-1  Super+Alt+3  Super+Alt+Shift+3

# Laptop (14-15)
14  eDP-1      Super+Alt+4  Super+Alt+Shift+4
15  eDP-1      Super+Alt+5  Super+Alt+Shift+5
