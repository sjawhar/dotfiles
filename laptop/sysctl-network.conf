# Interfaces created after boot get no automatic IPv6 link-local address.
#
# Chrome on Linux treats an IPv6 address appearing or disappearing on any
# interface as a network change and aborts every request in flight with
# net::ERR_NETWORK_CHANGED (https://issues.chromium.org/issues/40175348).
# Under the kernel default (0), each Docker container's host-side veth gains a
# link-local address while the container runs and loses it when the container
# stops, so a test suite that starts containers keeps cutting the browser's
# open connections, Dispatch's live event stream among them.
#
# 1 makes the kernel generate no link-local address on new interfaces.
# NetworkManager already sets 1 on the interfaces it manages and adds their
# link-local addresses itself. A container's own interfaces sit in a new
# network namespace, whose IPv6 settings start from kernel defaults
# (net.core.devconf_inherit_init_net = 0), so containers keep theirs. A Docker
# bridge network with IPv6 enabled keeps the global gateway address Docker
# assigns it and has no link-local address.
net.ipv6.conf.default.addr_gen_mode = 1
