# Desk layouts: drives apply-desk-layout.
#
# cosmic-comp remembers a layout only for the exact set of connector names it saw
# (DP-12, DVI-I-3, ...). Docks and DisplayLink adapters renumber connectors on every
# reconnect, so cosmic-comp misses its saved layout and falls back to defaults: 4K
# screens at 200% scale, landscape, side by side. This file names each desk by its
# monitors instead, and workspace-shortcuts.service re-applies the matching desk
# whenever the set of connected outputs changes (apply-desk-layout --apply --if-changed).
# A layout you drag by hand holds until the next reconnect; to keep it, update the rows
# here (`apply-desk-layout --capture <desk>` prints the current layout as rows), then
# run `laptop/apply-desk-layout --apply` (it prints its plan without --apply).
#
# Columns: <desk> <monitor> <need> <mode> <scale> <transform> <x> <y>
#   monitor    exact connector name, then exact EDID serial, then case-insensitive
#              model substring, as in workspaces.conf. Use serials for anything a dock
#              can renumber; `cosmic-randr list --kdl` prints serial_number.
#   need       required: the desk matches only while this monitor is connected.
#              optional: placed when connected, ignored otherwise.
#   mode       WIDTHxHEIGHT for that size's highest refresh rate, or
#              WIDTHxHEIGHT@HZ for the refresh closest to HZ (keep bandwidth-limited
#              docks off modes they cannot drive together).
#   transform  normal, rotate90, rotate180, rotate270 (cosmic-randr names).
# The desk whose required monitors are all connected wins; with several, the one with
# the most required monitors. Disabled outputs and outputs no row names are left alone.

# San Francisco home, Dell SD25TB4 dock: laptop at far left, BenQ left portrait, LG
# ULTRAWIDE (3440x1440), Samsung right portrait, the InnoView under the ultrawide.
home  eDP-1         optional  1920x1200  1     normal     0     1774
home  M9F05041SL0   required  3840x2160  1     rotate270  1920  0
home  0x0000A9F2    required  3440x1440  1     normal     4080  1133
home  HCHN700631    required  3840x2160  1     rotate270  7520  63
home  InnoView      optional  2560x1440  1.25  normal     4802  2573

# The same desk with the ASUS under the ultrawide (more required monitors, so it wins
# over home while the ASUS is connected); the InnoView, if also there, goes below it.
home-asus  eDP-1         optional  1920x1200  1     normal     0     1774
home-asus  M9F05041SL0   required  3840x2160  1     rotate270  1920  0
home-asus  0x0000A9F2    required  3440x1440  1     normal     4080  1133
home-asus  HCHN700631    required  3840x2160  1     rotate270  7520  63
home-asus  HCLMTF089038  required  1920x1080  1     normal     4080  2573
home-asus  InnoView      optional  2560x1440  1.25  normal     4080  3653

# San Francisco office, Anker USB-C hub: twin Dell U3225QE portraits (left BC7Z784,
# right FD7Z784), LG HDR WQHD+ ultrawide (3840x1600), laptop and ASUS side by side
# under the ultrawide.
office  BC7Z784     required  3840x2160  1     rotate270  0     0
office  WQHD+       required  3840x1600  1     normal     2160  1182
office  FD7Z784     required  3840x2160  1     rotate90   6000  173
office  MB16AC      optional  1920x1080  1     normal     2160  2782
office  eDP-1       optional  1920x1200  1     normal     4080  2782

# Salt Lake City home (old desk): laptop at left, Samsung LS32A70 left portrait, AOC
# top ultrawide (60Hz) over the Sceptre bottom ultrawide (165Hz), Samsung U32J59x
# right portrait, the InnoView upside down under the Sceptre, as that desk ran them.
slc  eDP-1      optional  1920x1200      1    normal     0     0
slc  LS32A70    required  3840x2160      1    rotate90   1920  0
slc  U34G2G4R3  required  3440x1440@60   1    normal     4080  0
slc  O34        required  3440x1440@165  1    normal     4080  1440
slc  U32J59x    optional  3840x2160      1    rotate270  7520  0
slc  InnoView   optional  2560x1440      1.1  rotate180  4636  2880
