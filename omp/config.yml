modelRoles:
  # Sami, 2026-11-01 22:30Z (dispatch://INFRA-26/ask/d42777be-b790-4abe-b540-9d77146f2ba2): "can we
  # get all the agents that are running on the dev box switched over to Opus 5.5". This replaces
  # his 2026-10-29 ~03:15Z direction to run on Opus 5 instead of 5.5 to balance load across the
  # accounts. A brief cannot pin a model (the task tool takes one only for seance agents), so these
  # roles are the lever; running sessions were moved with `/switch` the same night.
  default: anthropic/claude-opus-5-5
  plan: anthropic/claude-fable-5-1:max
  smol: anthropic/claude-sonnet-5-5
  slow: openai-codex/gpt-5.6-terra:xhigh
  task: anthropic/claude-opus-5-5
  vision: google/gemini-3.7-flash:medium
  # The review gates and the oracle advisors run cross-family on GPT-6.1 Sol
  # through the OSS Verify gateway (team `box`; no OpenAI key sits on the box,
  # but the gateway's own OpenAI credential IS billed PER TOKEN -- measured
  # 2026-11-04: one client on sami-devbox took gateway Sol from $14/h at 22Z to
  # $973/h at 05:55Z, and two OpenAI auto top-ups of about $4k hit the card that
  # night. An earlier wording here said "no per-token OpenAI key", which read as
  # "this route is not billed per token" and is false), not
  # the Codex subscription, whose window is spent until 2026-11-04T06:35Z: a
  # gate that answers from Claude is a same-family read wearing a
  # cross-family label. Until 2026-11-03 they ran per-token
  # openai/gpt-5.6-terra, about $560-1,065/day in telemetry (which sees about
  # half the key's bill; agent_spend.spend_daily, 11-01 to 11-03), moved with
  # Astra (dispatch://INFRA-165, Sami's Sol preference dispatch://BET-545).
  # A role may list models; the first one the machine declares is used:
  # sami-rocqperf's id first, then sami-devbox's (measured 2026-11-03 on
  # devbox: code-reviewer on this list was served by
  # ossv-gateway/openai/gpt-6.1-sol). Their chains below end on Codex Sol and
  # name no Anthropic model, so a gate with nothing reachable refuses.
  review:
    - ossv-gateway-openai/openai/gpt-6.1-sol:xhigh
    - ossv-gateway/openai/gpt-6.1-sol:xhigh
  # The Legion plugin's agents name these two roles: oracle for oracle and
  # plan-gap-analyst, deep for deep-worker. Unmapped, those agents fail with
  # "No model selected". Same models as omp/agents/oracle.md and deep.md (@slow).
  #
  # `oracle` is read-only advice, so it moves to the API lane with the gates.
  # `slow` and `deep` stay on the subscription deliberately: they carry the
  # fleet's implementation volume, and moving that to per-token billing is a
  # spend decision rather than a routing one. While the window is spent they
  # fall to Anthropic and are therefore same-family -- which their own agent
  # descriptions say, and which a caller who needs a cross-family read answers
  # by dispatching sol by name.
  oracle:
    - ossv-gateway-openai/openai/gpt-6.1-sol:high
    - ossv-gateway/openai/gpt-6.1-sol:high
  deep: openai-codex/gpt-5.6-terra:xhigh
  advisor: anthropic/claude-sonnet-5-5:medium
  # pi-envoy's AskGate asks this role (else `default`) before each Dispatch write.
  askgate: anthropic/claude-fable-5-1:high
  proactiveMemory: anthropic/claude-sonnet-5-5
  judgeLog: anthropic/claude-sonnet-5-5
# What Sami's pause on the OpenAI API means, in his words, 2026-10-30 ~01:30Z
# (goals-md v43): "I keep saying, 'Let's pause using the OpenAI API,' and you
# guys turn this into, 'Let's disable the OpenAI API everywhere.' Can you
# please just stop doing that?" So the pause is a default, not a prohibition:
# agents default to Claude, and the provider stays reachable for the agents
# that are named on it. His original words, 2026-10-26 02:47Z
# (dispatch://OSSV-201/comment/1a304d1c-c8cf-4796-8e89-105cbef3357c): "let's
# pause on using OpenAI API and just continue using Claude for everything
# instead".
#
# `disabledProviders: [openai]` was this file reading that as a prohibition,
# and it, not a wrong model id, was the whole reason astra-api and gpt-api
# could not start. Measured 2026-10-30 01:00-01:12Z: both ids those two agents
# name exist in omp's catalog and on the live API under this box's key (among
# the 142 the key reaches), and with the provider reachable astra-api served
# openai/gpt-6-astra and gpt-api served openai/gpt-5.6-terra, read back from
# each subagent's own transcript.
#
# The boundary that comes with it, and where it does not hold. No wildcard
# chain routes to an OpenAI model: `openai/*: []` below stops every OpenAI
# model that is not one of the named ones from inheriting the Anthropic
# `default` chain, and a plain `task` subagent serves Claude. Since 2026-11-03
# (dispatch://INFRA-165) no role, agent or chain here names a per-token
# `openai/` model as a target: the `review` and `oracle` roles, the astra
# chains, astra-api, gpt-api and oracle all run GPT-6.1 Sol through the OSS
# Verify gateway, which still calls OpenAI (billed to team `box`). A stream
# that must stay off OpenAI entirely avoids every cross-family agent and the
# @review agents (bug-finder, code-reviewer, comment-analyzer, test-analyzer,
# both thermonuclear-*) by name.
# The model-spend records of installers/agent-spend.sh (one per model call) carry
# the spend. openai-codex (the Codex subscription) is a separate provider and
# was never paused.
extensionHandlers:
  # pi-envoy's AskGate (@sjawhar/pi-envoy, README "The time limit") holds its
  # 90 s review 5 s under this ceiling: at omp's 30 s default it would get
  # 25 s, and a review of a long session that times out lets the write post
  # unreviewed. A handler that outruns the ceiling is refused. Global: any
  # tool_call handler in any extension may hold a tool call for up to 120 s.
  toolCallTimeoutMs: 120000
retry:
  modelFallback: true
  usageAwareFallback: true
  fallbackChains:
    # Every chain runs past claude-opus-4-8 to 4.7 and 4.6. A classifier refusal
    # walks the chain, and in the 21 days to 2026-10-07 four of the six subagent
    # turns that died stopped at 4.8 with nothing below it tried, though both
    # older models answer the same request (dispatch://AGENTC-319). Anthropic
    # refuses 4.7 and 4.6 as server-side `fallbacks` targets, so this chain is
    # the only thing that reaches them.
    anthropic/claude-fable-5:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
    anthropic/claude-fable-5-1:
      - anthropic/claude-fable-5
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
    anthropic/claude-opus-5-5:
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
    anthropic/claude-opus-5:
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
    # Codex (ChatGPT Pro subscription) falls to the Anthropic tier that matches
    # the failing model; exact keys beat the wildcard. Model keys beat every
    # role chain, a subagent's own included, and an effort-suffixed key matches
    # only that effort, so gpt-6-astra at high (the sami-proxy agent alone, and
    # that agent is a stand-in for Sami, not a cross-family reviewer) falls to
    # Opus 5.5. No other agent may run gpt-6-astra at high.
    #
    # The three cross-family keys below are the exception, and none of them
    # names an Anthropic model: a cross-family review answered by Claude is a
    # same-family review wearing the wrong label, and it reads as a pass. Each
    # degrades inside non-Anthropic models only — the OpenAI API ids this box's
    # key reaches, then the Codex subscription when its window is open — and
    # when no link is usable the spawn refuses, naming the chain key and every
    # link it tried, instead of answering. The caller then runs a Claude reader
    # that did not write the change, and labels that review same-family.
    #
    # They were `[]` until 2026-10-29, which is why no cross-family review ran
    # between the Codex usage limit of 2026-10-29 and its 2026-11-04 reset, and
    # for one commit (b9cef6d) they ended on `vertex/google/*` Gemini. Those
    # Gemini entries are gone: no key owns a `vertex/*` model, so a walk that
    # lands on one and then fails resolves `default` and answers from Claude —
    # the single outcome these three keys exist to prevent. Re-adding Gemini
    # needs a `vertex/*` (or per-id) key of its own, and that also changes what
    # the Verified Linux Gemini sessions fall back to, so it is theirs to call.
    #
    # `openai/*: []` is the boundary for every other OpenAI model: no chain, so
    # no silent Anthropic answer and no unasked per-token spend. Exact keys beat
    # it — measured 2026-10-30, astra-api on a typo'd id refused with
    # `retry.fallbackChains["openai/*"] is empty`, and on its real id with both
    # OpenAI providers disabled it refused naming all three of its own links.
    # 2026-11-03 (INFRA cost cut, dispatch://INFRA-165): per-token
    # openai/gpt-6-astra cost about $19.8k/day once the Codex window was spent
    # (11-02 ~21:00Z), since it was the astra chain's first link. Both astra
    # keys now go to GPT-6.1 Sol through the OSS Verify gateway (Sami's
    # preference, dispatch://BET-545), then Codex Sol, and never to a per-token
    # `openai/` model. Codex Astra stays the `astra` agent's own model: a
    # subscription, not per-token, used whenever its window is open. The
    # gateway Sol id differs per machine: sami-rocqperf declares it as
    # `ossv-gateway-openai/openai/gpt-6.1-sol`, sami-devbox as
    # `ossv-gateway/openai/gpt-6.1-sol` (devbox/sami-devbox-model-routes); each
    # chain names both, and a machine skips the id it does not declare.
    openai-codex/gpt-6-astra:high:
      - anthropic/claude-opus-5-5:xhigh
    openai-codex/gpt-6-astra:
      - ossv-gateway-openai/openai/gpt-6.1-sol
      - ossv-gateway/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    openai/*: []
    openai/gpt-6-astra:
      - ossv-gateway-openai/openai/gpt-6.1-sol
      - ossv-gateway/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    openai/gpt-5.6-terra:
      - ossv-gateway-openai/openai/gpt-6.1-sol
      - ossv-gateway/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    # The `sol` agent (agents/sol.md), the default cross-family subagent since
    # Sami's preference of 2026-11-02 (dispatch://BET-545). Its model is
    # GPT-6.1 Sol through the OSS Verify gateway, a provider only this box's
    # omp/models.local.yml declares; its one fallback is GPT-6.1 Sol on the
    # Codex subscription, and the two keys name each other as the astra pair
    # does. `ossv-gateway-openai/*: []` keeps any other model on that provider
    # off the Anthropic `default` chain, and the codex key keeps Codex Sol off
    # `openai-codex/*` below, which ends on Claude. No per-token `openai/` link:
    # the gateway bills OpenAI under team `box`'s budget instead -- which is
    # still PER TOKEN, not flat-rate (measured 2026-11-04, see the note at the
    # top of this file). Reaching OpenAI through the gateway changes who is
    # billed, not how. Measured
    # 2026-11-03 03:42-03:45Z from scratch sessions: the gateway served
    # `openai/gpt-6.1-sol` through a bash tool call; with the gateway
    # unreachable, and on a machine without the provider, the spawn fell to
    # Codex Sol and refused (`usage_limit_reached`) instead of answering.
    ossv-gateway-openai/openai/gpt-6.1-sol:
      - ossv-gateway/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    ossv-gateway-openai/*: []
    ossv-gateway/openai/gpt-6.1-sol:
      - ossv-gateway-openai/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    openai-codex/gpt-6.1-sol:
      - ossv-gateway-openai/openai/gpt-6.1-sol
      - ossv-gateway/openai/gpt-6.1-sol
    # openai-codex/gpt-5.5 was retired from the catalog; the resolver already
    # matched it to gpt-5.6-terra, which has its own chain below.
    openai-codex/gpt-5.6-sol:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
    openai-codex/gpt-5.6-terra:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
      - anthropic/claude-sonnet-5-5
    openai-codex/gpt-5.6-luna:
      - anthropic/claude-sonnet-5-5
    openai-codex/*:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
      - opencode-zen/*
    default:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
    plan:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
      - anthropic/claude-opus-4-7
      - anthropic/claude-opus-4-6
task:
  maxRecursionDepth: 3
  # omp's soft per-subagent request budget. The shipped default is 200: crossing it
  # steers a subagent to wrap up, 1.5x (300) FORCE-STOPS its turn, and a few requests
  # later it is hard-aborted. Measured cost on this box: five OSS Verify subagents
  # stopped mid-work on 2026-11-04, one mid-proof, and Enroll19b killed at 305
  # requests on 2026-10-25 -- 200 x 1.5 = 300 plus the grace window, exactly. Each
  # stop costs a restart and a context reload, and a proof agent legitimately runs
  # past 300 requests.
  #
  # 5000, not 0, and the authority for that is Sami's own recorded decisions rather
  # than a standing-rules line. He asked whether a parent is told it can resume a
  # subagent stopped at 200 (dispatch://INFRA-28/ask/7c8ca516-4bcf-4458-a519-dd17e8f8451d)
  # and accepted, on dispatch://INFRA-315, either of: the subagent "finishes without a
  # stop at 200, or the parent resumes it within one minute without a person". A 5000
  # budget satisfies the first branch for every run this box has ever produced.
  #
  # An earlier version of this comment cited OSS Verify's standing rule "Never limit
  # an agent's conversation". That line carries no link to a decision, and goals-md
  # says of itself that an instruction without one is someone's reading; the OSS
  # Verify lead corrected the citation and withdrew their request for 0. Kept here so
  # nobody restores 0 on the strength of the reading.
  #
  # Why not 0 even so: this file is box-wide, so 0 removes the floor for every stream,
  # including those with no such rule, on a machine running 80k+ model calls since
  # 23:00Z. 5000 is sixteen times the longest run ever stopped here (305 requests), so
  # it cannot stop real work, and it still halts a subagent looping without end.
  #
  # If a stream needs a literal 0, the narrower lever is task.agentSoftRequestBudget,
  # whose per-agent entry REPLACES both this value and an agent's lower bundled cap.
  softRequestBudget: 5000
  agentModelOverrides:
    # These types named Opus 5.5 while the roles above ran on Opus 5 (2026-10-29 to 2026-11-01),
    # because a lead measured that a weaker verdict changes the result: reviewer and the
    # review-role types gate merges (Rocq speed's gates caught #1950's stale-cache key and #1958's
    # box cap that night; task making's caught 4 defects in #1967 that tests missed), and a wrong
    # pass there merges a defect. Every other agent type takes `task`, now Opus 5.5 as well.
    reviewer: anthropic/claude-opus-5-5
    bug-finder: "@review"
    code-architect: anthropic/claude-opus-5-5
    code-reviewer: "@review"
    code-simplifier: anthropic/claude-fable-5-1
    comment-analyzer: "@review"
    cybersecurity-expert: anthropic/claude-opus-5-5
    performance-engineer: "@slow"
    red-teamer: anthropic/claude-opus-5-5
    test-analyzer: "@review"
    type-checker: anthropic/claude-opus-5-5
    ux-designer: "@vision"
  isolation:
    merge: patch
    enabled: true
# Shake runs first. With no model call, it swaps old tool output, and fenced or
# XML blocks of 400+ tokens in any message, for recovery placeholders, so a paid
# model-written summary runs only when shake cannot free enough (the shipped
# default tries shake after handoff). A local method first also turns off
# speculative background compaction, which speculates only on remote, handoff or
# soft, so when shake cannot free enough a remote summary runs synchronously at
# the threshold. AGENTC-1288, Sami, 2026-09-30.
compaction:
  methodOrder: [shake, remote, snapcompact, handoff, soft]
advisor:
  enabled: true
# omp's own interceptor stays on in this shared file: a session that predates the experiments
# extension's bash gate (experiments/bash-gate*.ts) has no other bash gate.
bashInterceptor:
  enabled: true
# The status-line git integration (branch, dirty counts, PR) re-runs
# `git status --porcelain --untracked-files=normal` as a child process every
# 2-3 s per session; in agent-c that is ~150k filesystem calls and 0.45 s per
# run, and parsing its output churns the native allocator (AGENTC-814). Sami
# does not read the footer's branch or counts.
git:
  enabled: false
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  # Only deliberate saves are stored: the retain and learn tools, and an explicit
  # `/memory enqueue`. autoRetain would store a raw transcript slice every 4 user
  # turns and at session exit; those slices outranked deliberate saves in recall
  # (AGENTC-1305).
  autoRetain: false
  polyphonicRecall: true
  enhancedRecall: true
  proactiveLinking: true
theme:
  dark: titanium
symbolPreset: unicode
hideThinkingBlock: true
doubleEscapeAction: tree
extendedContext: true
dev:
  autoqaConsent: granted
setupVersion: 2
# The update check asks upstream (can1357/oh-my-pi) and `omp update` would
# `mise upgrade github:can1357/oh-my-pi` - the fork's pin in mise.toml is the
# only version of record; no banner steering a session toward upstream.
startup:
  checkUpdate: false
display:
  smoothStreaming: false
  hideToolActivity: false
  shimmer: disabled
  # Keep the transcript before each compaction inline, behind a divider. The
  # default (true) rebuilds the live transcript from only the kept tail and
  # clears scrollback, so everything before a compaction or handoff vanishes
  # from both the fullscreen viewport and the normal screen's scrollback.
  collapseCompacted: false
tui:
  resizeScrollback: preserve
  rewindScrollback: preserve
# No inline word predictions (dim ghost text after the cursor, accepted with
# Tab). The default, auto, predicts from prompt history on every platform.
spelling:
  autocomplete: "off"
# Ready sessions join the attention queue (omp/extensions/attention-queue.ts,
# scripts/tmux-attention) instead of ringing the bell: under tmux each of these
# writes an OSC 9 plus a BEL, Ghostty asks the desktop for attention, and
# Pop!_OS moves focus to that window.
completion:
  notify: "off"
ask:
  notify: "off"
error:
  notify: "off"
skills:
  ignoredSkills:
    - ce-commit-push-pr
    - ce-work
    - ce-worktree
    - lfg
    # dispatch://INFRA-323: writing-agent-skills (plugins/sjawhar) is the one
    # skill-writing skill. These two contradict it, and an agent that loads
    # both gets two procedures. superpowers' writing-skills (v6.3.0) keeps
    # detail inline, sets word targets under 500 and requires the TDD skill
    # first. skill-creator (Anthropic's, copied) asks for "pushy"
    # what-plus-when descriptions and evals through `claude -p`. ignoredSkills
    # matches by name, so the new skill has a different name.
    - writing-skills
    - skill-creator
    # Sami, 2026-11-02: he no longer uses the time-tracker tool this skill is
    # built on, and its recaps were the ones he called garbage. Its replacement
    # is plugins/sjawhar/skills/writing-a-standup-recap, which drafts from
    # pull requests, Dispatch records and his own past feedback. The two load
    # on the same words, so both cannot stay. time-tracker's other two skills
    # (todo, weekly-review) are untouched.
    - daily-standup
    # Dropped because their live (shortened) descriptions, what a session
    # actually sees in its skills list, trigger on work that doesn't need
    # Pulumi: pulumi-overview fires on any cloud/SaaS task and can silently
    # provision a Pulumi Cloud account (CLAUDE.md requires asking before
    # creating an account on an outside platform); pulumi-esc leads with
    # generic secrets/environments/OIDC triggers that overlap using-secrets,
    # even though it also names Pulumi stack config; package-usage and
    # pulumi-context-api fire on generic cross-stack/package-audit questions
    # with no Pulumi mention at all.
    - package-usage
    - pulumi-context-api
    - pulumi-esc
    - pulumi-overview
    - sentry-android-sdk
    - sentry-browser-sdk
    - sentry-cocoa-sdk
    - sentry-code-review
    - sentry-create-alert
    - sentry-dotnet-sdk
    - sentry-feature-setup
    - sentry-fix-issues
    - sentry-go-sdk
    - sentry-nestjs-sdk
    - sentry-nextjs-sdk
    - sentry-node-sdk
    - sentry-otel-exporter-setup
    - sentry-php-sdk
    - sentry-pr-code-review
    - sentry-react-native-sdk
    - sentry-react-sdk
    - sentry-ruby-sdk
    - sentry-sdk-setup
    - sentry-sdk-skill-creator
    - sentry-sdk-upgrade
    - sentry-setup-ai-monitoring
    - sentry-svelte-sdk
    - sentry-workflow
    # The ctx-memory plugin (omp/plugins/package.json) ships the ingest cycle's
    # procedure beside the reading skill. Only the scheduled cycle runs it, in
    # its own image; a session here reads the graph with ctx-memory.
    - ctx-memory-ingest
# 1-hour prompt-cache entries (dispatch://INFRA-1058). Without it omp writes 5-minute entries on an API key, so a
# session idle 5-60 minutes (waiting on a reviewer, a job, a subagent) writes its whole context again. Here, not in
# the machine-local config.local.yml: shims/omp loads that file for the default profile only, so `--profile pbc`
# never had it, and two rewrites of it on 2026-11-03 dropped it. It reaches every provider: omp/models.yml turns off
# the per-token OpenAI flags `long` would change (12h/24h retention at a higher write price); openai-codex and Google
# ignore it, and on Anthropic it marks `ttl: 1h` only where the model's compat has supportsLongCacheRetention.
providers:
  cacheRetention: long
  anthropic:
    serverSideFallback: true
    # Sent only when the primary is Fable/Mythos. Every entry must be in that
    # primary's allowed_fallback_models (GET /v1/models/<id> with the
    # server-side-fallback-2026-06-01 beta), or the whole request 400s. On
    # 2026-09-22 both Fable 5 and 5.1 allow only claude-opus-5 and claude-opus-4-8;
    # claude-opus-5-5 is not a valid target. At most three entries; order = preference.
    serverSideFallbackModels:
      - claude-opus-5
      - claude-opus-4-8
composer:
  shape: box
isolation:
  backend: auto
codexResets:
  autoRedeem: "yes"
# dispatch://INFRA-339: pi-envoy exports DISPATCH_HOST, DISPATCH_SESSION_ID and
# ENVOY_CONFIG_FILE for the session, and Legion panes get DISPATCH_URL; the
# Python eval kernel drops every variable outside its allowlist, so `dispatch`
# from an eval cell failed with "DISPATCH_HOST is not set". This admits them.
# Read by omp v18.12.2-sami.20261025-065250 and later; older builds load the
# file and leave the key unread.
# extensions/session-env.ts exports the session's identity for child processes:
# OMP_SESSION_ID (agent-secrets, scripts/envoy, nested omp, shims/git's
# Omp-Session trailer) and JJ_CONFIG (jj's Omp-Session trailer and the
# cross-session immutable_heads() guard); PI_COMMIT_TRAILERS passes already as
# a PI_ variable. Admitting both names gives a command run from an eval cell
# the identity it gets from bash. omp sets neither variable itself, so this
# belongs here, not in omp's built-in allowlist. GH_CONFIG_DIR (session-env.ts,
# scripts/agent-session) is the gh config directory with no login of the user's:
# without it a kernel's gh reads ~/.config/gh, and on 2026-11-02T00:07Z an eval
# cell's `gh pr review --approve` approved a pull request as the user that way.
# GOOGLE_APPLICATION_CREDENTIALS (same two places) names the machine's own
# Google identity: without it a kernel's google.auth.default() reads the
# well-known ADC file, which is the user's own login on sami-rocqperf.
eval:
  envPassthrough:
    names:
      - OMP_SESSION_ID
      - JJ_CONFIG
      - GH_CONFIG_DIR
      - GOOGLE_APPLICATION_CREDENTIALS
    prefixes:
      - DISPATCH_
      - ENVOY_
