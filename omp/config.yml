modelRoles:
  default: anthropic/claude-fable-5-1:xhigh
  plan: anthropic/claude-fable-5-1:max
  smol: anthropic/claude-sonnet-5
  slow: openai-codex/gpt-5.6-terra:xhigh
  task: anthropic/claude-sonnet-5
  vision: google/gemini-3.7-flash:medium
  review: openai-codex/gpt-5.5:xhigh
  advisor: anthropic/claude-sonnet-5:medium
retry:
  modelFallback: true
  fallbackChains:
    anthropic/claude-fable-5:
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
    anthropic/claude-fable-5-1:
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
    anthropic/claude-opus-5:
      - anthropic/claude-opus-4-8
    default:
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
    plan:
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8
task:
  maxRecursionDepth: 3
  agentModelOverrides:
    bug-finder: "@review"
    code-architect: anthropic/claude-opus-5
    code-reviewer: "@review"
    code-simplifier: anthropic/claude-fable-5-1
    comment-analyzer: "@review"
    cybersecurity-expert: anthropic/claude-opus-5
    performance-engineer: "@slow"
    red-teamer: anthropic/claude-opus-5
    test-analyzer: "@review"
    type-checker: anthropic/claude-opus-5
    ux-designer: "@vision"
  isolation:
    mode: auto
    merge: patch
advisor:
  enabled: true
bashInterceptor:
  enabled: true
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  polyphonicRecall: true
  enhancedRecall: true
  proactiveLinking: true
theme:
  dark: titanium
symbolPreset: unicode
hideThinkingBlock: false
doubleEscapeAction: tree
dev:
  autoqaConsent: granted
setupVersion: 2
display:
  smoothStreaming: false
  hideToolActivity: false
  shimmer: disabled
tui:
  resizeScrollback: preserve
  rewindScrollback: preserve
skills:
  ignoredSkills:
    - ce-commit-push-pr
    - ce-debug
    - ce-work
    - ce-worktree
    - lfg
    # sentry-for-ai ships ~25 skills; only the Python SDK one is wanted (the
    # rest swamp session context). Mirrors installers/opencode.sh's curation.
    - sentry-android-sdk
    - sentry-browser-sdk
    - sentry-cocoa-sdk
    - sentry-code-review
    - sentry-create-alert
    - sentry-dotnet-sdk
    - sentry-feature-setup
    - sentry-fix-issues
    - sentry-go-sdk
    - sentry-nestjs-sdk
    - sentry-nextjs-sdk
    - sentry-node-sdk
    - sentry-otel-exporter-setup
    - sentry-php-sdk
    - sentry-pr-code-review
    - sentry-react-native-sdk
    - sentry-react-sdk
    - sentry-ruby-sdk
    - sentry-sdk-setup
    - sentry-sdk-skill-creator
    - sentry-sdk-upgrade
    - sentry-setup-ai-monitoring
    - sentry-svelte-sdk
    - sentry-workflow
providers:
  anthropic:
    serverSideFallback: true
    serverSideFallbackModels:
      - claude-opus-5
      - claude-opus-4-8
composer:
  shape: box
