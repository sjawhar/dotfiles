modelRoles:
  # Sami, 2026-11-01 22:30Z (dispatch://INFRA-26/ask/d42777be-b790-4abe-b540-9d77146f2ba2): "can we
  # get all the agents that are running on the dev box switched over to Opus 5.5". This replaces
  # his 2026-10-29 ~03:15Z direction to run on Opus 5 instead of 5.5 to balance load across the
  # accounts. A brief cannot pin a model (the task tool takes one only for seance agents), so these
  # roles are the lever; running sessions were moved with `/switch` the same night.
  default: anthropic/claude-opus-5-5:xhigh
  plan: anthropic/claude-fable-5-1:max
  smol: anthropic/claude-sonnet-5-5
  slow: openai-codex/gpt-5.6-terra:xhigh
  task: anthropic/claude-opus-5-5:xhigh
  vision: google/gemini-3.7-flash:medium
  # The review gates and the oracle advisors run cross-family on GPT-6.1 Sol
  # through Theorem's model gateway (team `box`; no OpenAI key sits on the box,
  # but the gateway's own OpenAI credential IS billed PER TOKEN -- measured
  # 2026-11-04: one client on sami-devbox took gateway Sol from $14/h at 22Z to
  # $973/h at 05:55Z, and two OpenAI auto top-ups of about $4k hit the card that
  # night. An earlier wording here said "no per-token OpenAI key", which read as
  # "this route is not billed per token" and is false), not
  # the Codex subscription, whose window is spent until 2026-11-04T06:35Z: a
  # gate that answers from Claude is a same-family read wearing a
  # cross-family label. Until 2026-11-03 they ran per-token
  # openai/gpt-5.6-terra, about $560-1,065/day in telemetry (which sees about
  # half the key's bill; agent_spend.spend_daily, 11-01 to 11-03), moved with
  # Astra (dispatch://INFRA-165, Sami's Sol preference dispatch://BET-545).
  # A role may list models; the first one the machine declares is used. Both
  # machines declare `model-gateway-openai/openai/...`, the first entry of each
  # list below. The `model-gateway/openai/...` entries are there only for a
  # session that knows no `model-gateway-openai` id; the agent files that list
  # both names (omp/agents/oracle.md, sol.md, astra-api.md, gpt-api.md) do the
  # same. Their chains below end on Codex Sol and name no Anthropic model, so a
  # gate with nothing reachable refuses.
  #
  # 2026-11-04: both roles lead on the gateway's Flex tier
  # (`openai/gpt-6.1-sol-flex`, the cheaper queued tier of the same model),
  # approved by the INFRA lead on agentvm's measurement of 40 review-sized
  # calls: p50 6.9 s, p95 30.2 s, max 48.6 s, 0 failures. `-flex` (not
  # `-flex-only`) promotes itself to standard on a real 429, a server-fault
  # 5xx or a timeout with no answer, and the standard ids follow it here, so a
  # machine that does not declare Flex falls through to standard rather than
  # failing. Undo = revert this commit; the triggers are fallback share over
  # 10%, p95 over 90 s, or any handler timeout.
  review:
    - model-gateway-openai/openai/gpt-6.1-sol-flex:xhigh
    - model-gateway/openai/gpt-6.1-sol-flex:xhigh
    - model-gateway-openai/openai/gpt-6.1-sol:xhigh
    - model-gateway/openai/gpt-6.1-sol:xhigh
  # The Legion plugin's agents name these two roles: oracle for oracle and
  # plan-gap-analyst, deep for deep-worker. Unmapped, those agents fail with
  # "No model selected". Same models as omp/agents/oracle.md and deep.md (@slow).
  #
  # `oracle` is read-only advice, so it moves to the API lane with the gates.
  # `slow` and `deep` stay on the subscription deliberately: they carry the
  # fleet's implementation volume, and moving that to per-token billing is a
  # spend decision rather than a routing one. While the window is spent they
  # fall to Anthropic and are therefore same-family -- which their own agent
  # descriptions say, and which a caller who needs a cross-family read answers
  # by dispatching sol by name.
  oracle:
    - model-gateway-openai/openai/gpt-6.1-sol-flex:high
    - model-gateway/openai/gpt-6.1-sol-flex:high
    - model-gateway-openai/openai/gpt-6.1-sol:high
    - model-gateway/openai/gpt-6.1-sol:high
  deep: openai-codex/gpt-5.6-terra:xhigh
  advisor: anthropic/claude-sonnet-5-5:medium
  # pi-envoy's AskGate asks this role (else `default`) before each Dispatch write.
  askgate: anthropic/claude-fable-5-1:high
  proactiveMemory: anthropic/claude-sonnet-5-5
  judgeLog: anthropic/claude-sonnet-5-5
# What Sami's pause on the OpenAI API means, in his words, 2026-10-30 ~01:30Z
# (goals-md v43): "I keep saying, 'Let's pause using the OpenAI API,' and you
# guys turn this into, 'Let's disable the OpenAI API everywhere.' Can you
# please just stop doing that?" So the pause is a default, not a prohibition:
# agents default to Claude, and the provider stays reachable for the agents
# that are named on it. His original words, 2026-10-26 02:47Z
# (dispatch://OSSV-201/comment/1a304d1c-c8cf-4796-8e89-105cbef3357c): "let's
# pause on using OpenAI API and just continue using Claude for everything
# instead".
#
# `disabledProviders: [openai]` was this file reading that as a prohibition,
# and it, not a wrong model id, was the whole reason astra-api and gpt-api
# could not start. Measured 2026-10-30 01:00-01:12Z: both ids those two agents
# name exist in omp's catalog and on the live API under this box's key (among
# the 142 the key reaches), and with the provider reachable astra-api served
# openai/gpt-6-astra and gpt-api served openai/gpt-5.6-terra, read back from
# each subagent's own transcript.
#
# The boundary that comes with it, and where it does not hold. No wildcard
# chain routes to an OpenAI model: `openai/*: []` below stops every OpenAI
# model that is not one of the named ones from inheriting the Anthropic
# `default` chain, and a plain `task` subagent serves Claude. Since 2026-11-03
# (dispatch://INFRA-165) no role, agent or chain here names a per-token
# `openai/` model as a target: the `review` and `oracle` roles, the astra
# chains, astra-api, gpt-api and oracle all run GPT-6.1 Sol through the OSS
# Verify gateway, which still calls OpenAI (billed to team `box`). A stream
# that must stay off OpenAI entirely avoids every cross-family agent and the
# @review agents (bug-finder, code-reviewer, comment-analyzer, test-analyzer,
# both thermonuclear-*) by name.
# The model-spend records of installers/agent-spend.sh (one per model call) carry
# the spend. openai-codex (the Codex subscription) is a separate provider and
# was never paused.
extensionHandlers:
  # pi-envoy's AskGate (@sjawhar/pi-envoy, README "The time limit") holds its
  # 90 s review 5 s under this ceiling: at omp's 30 s default it would get
  # 25 s, and a review of a long session that times out lets the write post
  # unreviewed. A handler that outruns the ceiling is refused. Global: any
  # tool_call handler in any extension may hold a tool call for up to 120 s.
  toolCallTimeoutMs: 120000
retry:
  modelFallback: true
  usageAwareFallback: true
  fallbackChains:
    # 2026-11-12: every Opus 4.x entry names :high. Roles now run Opus 5.5 at :xhigh, and a fallback keeps the
    # effort it walked from; Opus 4.6 refuses xhigh with a 400 and no further fallback (S2 on pbc/claude-opus-4-6,
    # 2026-11-12 06:09-06:23Z, stuck until its effort was set by hand), so a walk past Opus 5 must drop to high.
    # Every chain runs past claude-opus-4-8 to 4.7 and 4.6. A classifier refusal
    # walks the chain, and in the 21 days to 2026-10-07 four of the six subagent
    # turns that died stopped at 4.8 with nothing below it tried, though both
    # older models answer the same request (dispatch://AGENTC-319). Anthropic
    # refuses 4.7 and 4.6 as server-side `fallbacks` targets, so this chain is
    # the only thing that reaches them.
    anthropic/claude-fable-5:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
    anthropic/claude-fable-5-1:
      - anthropic/claude-fable-5
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
    anthropic/claude-opus-5-5:
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
    anthropic/claude-opus-5:
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
    # Codex (ChatGPT Pro subscription) falls to the Anthropic tier that matches
    # the failing model; exact keys beat the wildcard. Model keys beat every
    # role chain, a subagent's own included, and an effort-suffixed key matches
    # only that effort, so gpt-6-astra at high (the sami-proxy agent alone, and
    # that agent is a stand-in for Sami, not a cross-family reviewer) falls to
    # Opus 5.5. No other agent may run gpt-6-astra at high.
    #
    # The three cross-family keys below are the exception, and none of them
    # names an Anthropic model: a cross-family review answered by Claude is a
    # same-family review wearing the wrong label, and it reads as a pass. Each
    # degrades inside non-Anthropic models only — the OpenAI API ids this box's
    # key reaches, then the Codex subscription when its window is open — and
    # when no link is usable the spawn refuses, naming the chain key and every
    # link it tried, instead of answering. The caller then runs a Claude reader
    # that did not write the change, and labels that review same-family.
    #
    # They were `[]` until 2026-10-29, which is why no cross-family review ran
    # between the Codex usage limit of 2026-10-29 and its 2026-11-04 reset, and
    # for one commit (b9cef6d) they ended on `vertex/google/*` Gemini. Those
    # Gemini entries are gone: no key owns a `vertex/*` model, so a walk that
    # lands on one and then fails resolves `default` and answers from Claude —
    # the single outcome these three keys exist to prevent. Re-adding Gemini
    # needs a `vertex/*` (or per-id) key of its own, and that also changes what
    # the Verified Linux Gemini sessions fall back to, so it is theirs to call.
    #
    # `openai/*: []` is the boundary for every other OpenAI model: no chain, so
    # no silent Anthropic answer and no unasked per-token spend. Exact keys beat
    # it — measured 2026-10-30, astra-api on a typo'd id refused with
    # `retry.fallbackChains["openai/*"] is empty`, and on its real id with both
    # OpenAI providers disabled it refused naming all three of its own links.
    # 2026-11-03 (INFRA cost cut, dispatch://INFRA-165): per-token
    # openai/gpt-6-astra cost about $19.8k/day once the Codex window was spent
    # (11-02 ~21:00Z), since it was the astra chain's first link. Both astra
    # keys now go to GPT-6.1 Sol through Theorem's model gateway (Sami's
    # preference, dispatch://BET-545), then Codex Sol, and never to a per-token
    # `openai/` model. Codex Astra stays the `astra` agent's own model: a
    # subscription, not per-token, used whenever its window is open. Both
    # machines declare the gateway's Sol as `model-gateway-openai/openai/gpt-6.1-sol`;
    # sami-devbox also declares the same route as `model-gateway/openai/gpt-6.1-sol`
    # (devbox/sami-devbox-model-routes: one URL, one `scripts/gateway-token`
    # key), an id older sessions there still know; its agent overrides name
    # `model-gateway-openai/openai/gpt-6.1-sol`. So a chain names the gateway once,
    # and no chain walks from one of those ids to the other: on sami-devbox that
    # hop sends the same request to the same route again (two cyber_policy
    # refusals of one Sol review on 2026-11-21 were sent again exactly that way).
    openai-codex/gpt-6-astra:high:
      - anthropic/claude-opus-5-5:xhigh
    openai-codex/gpt-6-astra:
      - model-gateway-openai/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    openai/*: []
    openai/gpt-6-astra:
      - model-gateway-openai/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    openai/gpt-5.6-terra:
      - model-gateway-openai/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    # The `sol` agent (agents/sol.md), the default cross-family subagent since
    # Sami's preference of 2026-11-02 (dispatch://BET-545). Its model is
    # GPT-6.1 Sol through Theorem's model gateway, a provider only this box's
    # omp/models.local.yml declares; its one fallback is GPT-6.1 Sol on the
    # Codex subscription, and the two keys name each other as the astra pair
    # does. `model-gateway-openai/*: []` keeps any other model on that provider
    # off the Anthropic `default` chain, and the codex key keeps Codex Sol off
    # `openai-codex/*` below, which ends on Claude. No per-token `openai/` link:
    # the gateway bills OpenAI under team `box`'s budget instead -- which is
    # still PER TOKEN, not flat-rate (measured 2026-11-04, see the note at the
    # top of this file). Reaching OpenAI through the gateway changes who is
    # billed, not how. Measured
    # 2026-11-03 03:42-03:45Z from scratch sessions: the gateway served
    # `openai/gpt-6.1-sol` through a bash tool call; with the gateway
    # unreachable, and on a machine without the provider, the spawn fell to
    # Codex Sol and refused (`usage_limit_reached`) instead of answering.
    # The Flex tier the @review and @oracle chains lead on. Named explicitly so
    # `model-gateway-openai/*: []` below does not leave a Flex call without a
    # fallback: the standard tier under the same provider name, then Codex Sol.
    # HDO maxed out with an auto-regulating back-off (Sami, 2026-11-05 08:50Z; chain shape from GATE 14:44Z).
    # The chain head is the BARE id on purpose: `claude-opus-5-5` hits the gateway's dedicated Opus 5.5 group
    # with its own HDO/HDO V2 session pin, where `anthropic/claude-opus-5-5` hits the anthropic/* wildcard --
    # same model, different group, different pinning. Both Fables are served on HDO V2 only and every HDO
    # team allows anthropic/*. Gateway-qualified on purpose: `anthropic/claude-fable-5-1` is the GATEWAY's
    # own model id (omp models model-gateway lists it), so a bare two-segment entry would resolve to the
    # DIRECT anthropic provider, which does not serve Fable at all. All three verified with real
    # completions at 14:45Z before this landed: 200, 200, 200.
    model-gateway/claude-opus-5-5:
      - model-gateway/anthropic/claude-fable-5-1
      - model-gateway/anthropic/claude-fable-5
    model-gateway-openai/openai/gpt-6.1-sol-flex:
      - model-gateway-openai/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    model-gateway/openai/gpt-6.1-sol-flex:
      - model-gateway/openai/gpt-6.1-sol
      - openai-codex/gpt-6.1-sol
    model-gateway-openai/openai/gpt-6.1-sol:
      - openai-codex/gpt-6.1-sol
    # This provider serves only OpenAI ids, so anything else on it refuses
    # instead of answering from Claude.
    model-gateway-openai/*: []
    model-gateway/openai/gpt-6.1-sol:
      - openai-codex/gpt-6.1-sol
    # 2026-11-06 23:4xZ: the old OSS-named provider aliases and their mirror chains are
    # GONE, with those aliases in each machine's models.local.yml, in one cutover (Sami,
    # INFRA-481: the gateway is Theorem's, not OSS Verify's, and is not to carry that name).
    #
    # They existed because the 14:55Z rename on 11-05 moved every chain key here to
    # model-gateway* while the aliases still served live arms: a session on an alias matched NO
    # key and NO guard, resolved `default` -- which is Claude -- and 64 turns of #18131 round 7
    # were written by Anthropic under a Sol verdict. The lesson is kept as the rule below, not
    # as a second set of names: NO chain key may resolve to `default`, and the cutover check is
    # that every id named by an agent or a chain resolves to a declared provider.
    openai-codex/gpt-6.1-sol:
      - model-gateway-openai/openai/gpt-6.1-sol
    # openai-codex/gpt-5.5 was retired from the catalog; the resolver already
    # matched it to gpt-5.6-terra, which has its own chain below.
    openai-codex/gpt-5.6-sol:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
    openai-codex/gpt-5.6-terra:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
      - anthropic/claude-sonnet-5-5
    openai-codex/gpt-5.6-luna:
      - anthropic/claude-sonnet-5-5
    openai-codex/*:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
      - opencode-zen/*
    default:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
    plan:
      - anthropic/claude-opus-5-5
      - anthropic/claude-opus-5
      - anthropic/claude-opus-4-8:high
      - anthropic/claude-opus-4-7:high
      - anthropic/claude-opus-4-6:high
task:
  maxRecursionDepth: 3
  # The progress probe asks each running subagent of a top-level session for a percent and a
  # line on what it does now, and each ask sends the agent's whole context. On 2026-11-16 those
  # asks were 14% of sami-devbox's model usage, because they read only about 30% of that context
  # from the prompt cache; Sami chose "Turn it off now" on
  # dispatch://INFRA-4027/ask/e1be5d7e-c945-438b-b7aa-e1649ca8a9b4 (2026-11-16 19:41Z).
  # The fix is in v18.18.6-sami.20261117-053702, and Sami said on 2026-11-17 to turn the probe on
  # (dispatch://INFRA-4027/ask/32dc7c33-b1bd-49aa-9048-dd941ecb2b63). It is on in
  # omp/config.probe.yml, which scripts/agent-session names only for a session of a release that
  # holds the fix. It stays false in THIS file: a running session watches every PI_CONFIG_FILES
  # entry and reads this key at each subagent start, so true here turns the unfixed probe on in
  # every session that still runs an older release. Do not set it true here while a process of
  # such a release runs on any machine.
  completionProbe: false
  # task.softRequestBudget is deliberately ABSENT: the shipped default of 200 stands.
  # Sami decided it on 2026-10-25 04:55Z, choosing "Keep 200" from options that
  # included removing it and raising it to 1000, with the words "I do not care about
  # 30 seconds" and "If you resume a subagent, it just continues"
  # (dispatch://INFRA-315/ask/4e4326c7-be38-4b54-acc3-bdf525a9e662). The remedy for a
  # stopped subagent is the PARENT RESUMING IT, which continues with its context --
  # not a bigger budget.
  #
  # On 2026-11-04 this key was set to 0 at 09:38Z and to 5000 at 09:40Z, and removed
  # again at 10:06Z, about half an hour in total. Both values reversed his written
  # decision. The requesting lead cited a standing-rules line ("Never limit an agent's
  # conversation") that carries no link to a decision, and then an issue's "Done means"
  # line that is an agent's spec rather than his words; they found the real decision
  # themselves and asked for the revert. Recorded here so nobody re-derives 0 or 5000
  # from the same two sources: ask him instead.
  agentModelOverrides:
    # These types named Opus 5.5 while the roles above ran on Opus 5 (2026-10-29 to 2026-11-01),
    # because a lead measured that a weaker verdict changes the result: reviewer and the
    # review-role types gate merges (Rocq speed's gates caught #1950's stale-cache key and #1958's
    # box cap that night; task making's caught 4 defects in #1967 that tests missed), and a wrong
    # pass there merges a defect. Every other agent type takes `task`, now Opus 5.5 as well.
    reviewer: anthropic/claude-opus-5-5:xhigh
    bug-finder: "@review"
    code-architect: anthropic/claude-opus-5-5:xhigh
    code-reviewer: "@review"
    code-simplifier: anthropic/claude-fable-5-1
    comment-analyzer: "@review"
    cybersecurity-expert: anthropic/claude-opus-5-5:xhigh
    performance-engineer: "@slow"
    red-teamer: anthropic/claude-opus-5-5:xhigh
    test-analyzer: "@review"
    type-checker: anthropic/claude-opus-5-5:xhigh
    ux-designer: "@vision"
    # 2026-11-17 — THE SECURITY REVIEW AGENT ALONE ON CLAUDE, UNTIL OPENAI APPROVES THEOREM'S
    # ORGANIZATION FOR DAYBREAK RED (its cyber-access program). Sami, 07:07:07Z on
    # dispatch://INFRA-3682/ask/69b3e36a-c5b4-411b-8e34-d79109f5cfb4: "Both, for a time". OpenAI
    # refused nine of this agent's calls on cyber_policy from 05:46Z to 06:47Z, and repeated refusals
    # can revoke the whole organization's access when no per-user safety_identifier is sent (the
    # gateway sends none), which would take gpt-6.1-sol from every team. Every other role keeps its
    # model. REVERT this line when Daybreak Red is approved: the agent's own frontmatter,
    # model: ["@review"], then applies again.
    thermonuclear-deep-review: anthropic/claude-opus-5-5:xhigh
    # 2026-11-12 — EVERY CLAUDE WORKLOAD ON OPUS 5.5 AT XHIGH. Sami, 2026-11-12T06:00:10Z
    # (dispatch://INFRA-1393/comment/6d689bf2-526e-4224-86f6-56a585ce1267): "Unless we're actually running
    # into rate limits, please just make sure that we bump everything up to the latest model version ...
    # Essentially, just 5.5 and extra high reasoning." This replaces the 11-04 chore move below for
    # task, scout, sonic and planner. Without a suffix omp runs `defaultThinkingLevel` (high), so each
    # entry names :xhigh. The 11-04 note is kept as history.
    # 2026-11-04 16:25Z — CHORE SUBAGENTS MOVE TO OPUS 5. This carries out Sami's own decision of
    # 11-03 (dispatch://INFRA-481/ask/8af1836c): "Opus 5.5 only where the model is the point",
    # with checks, bookkeeping, producers, routine ports and subagent chores on Opus 5 / 4.8.
    # It is not a new decision and needed no new ask.
    #
    # Why now, measured by the infrastructure lead: the Opus 5.5 org limit (~20M uncached tokens
    # a minute across both orgs) is saturated — last hour peaked at 48.2M, p50 16.5M, and 429s
    # have run since 03:05Z. Team `box`, every omp agent on this devbox, is 25.1M of that peak
    # and 3.5M of the p50, with 15,086 429s today. Opus 5 and 4.8 have 8-9.5M free per org.
    #
    # `task` is the default every agent type without its own entry inherits, so this one line
    # moves the general subagent, scout, sonic and the rest. The entries above keep their models
    # because a weaker verdict there changes the result.
    task: anthropic/claude-opus-5-5:xhigh
    scout: anthropic/claude-opus-5-5:xhigh
    sonic: anthropic/claude-opus-5-5:xhigh
    # planner is listed ONLY to hold it where it was. Without this line it would inherit `task`
    # and silently drop to Opus 5, which is not what the decision says: a plan is one of the places
    # the model is the point. Anything else added to this file that must stay on 5.5 needs its
    # own line for the same reason.
    planner: anthropic/claude-opus-5-5:xhigh
  isolation:
    merge: patch
    enabled: true
# Shake runs first. With no model call, it swaps old tool output, and fenced or
# XML blocks of 400+ tokens in any message, for recovery placeholders, so a paid
# model-written summary runs only when shake cannot free enough (the shipped
# default tries shake after handoff). A local method first also turns off
# speculative background compaction, which speculates only on remote, handoff or
# soft, so when shake cannot free enough a remote summary runs synchronously at
# the threshold. AGENTC-1288, Sami, 2026-09-30.
compaction:
  methodOrder: [shake, remote, snapcompact, handoff, soft]
  # Keep gateway Sol prompts under OpenAI's 272,000-token long-context line.
  # Past it, OpenAI bills the WHOLE request at 2x input and cache rates and 1.5x
  # output. Measured by the cost lead from OpenAI's own report: of $12,978 of Sol
  # spend on the gateway project to ~09Z on 2026-11-04, $8,663 — 67% — was requests
  # over that line, with average prompts of 271-336K sitting just the wrong side.
  #
  # The line counts TOTAL input INCLUDING cache reads (OpenAI's own example: 20,000
  # new + 260,000 cache-read = a 280,000-token prompt at long-context rates). Our
  # prompts are ~96% cached, so a bound on NEW tokens would save nothing; this bounds
  # the whole context. 250,000 leaves 22,000 of headroom for the turn that triggers
  # compaction.
  #
  # The "f" prefix is load-bearing: a bare number here is the BASE the threshold
  # policy scales (percent of it), NOT a trigger, so `250000` would compact at some
  # fraction of 250K and `"f250000"` compacts AT 250K
  # (packages/coding-agent/src/config/compaction-threshold.ts, parseThresholdEntry).
  # Keys are `provider/model-id`, exact or a `*`-terminated prefix; the prefix covers
  # the effort suffixes (`:xhigh`, `:high`) the review and oracle roles pin.
  # A per-agent task.agentCompactionThresholdOverrides entry still outranks these.
  modelThresholds:
    model-gateway-openai/openai/gpt-6.1-sol*: "f250000"
    model-gateway/openai/gpt-6.1-sol*: "f250000"
    # The 2026-11-05 14:54Z provider rename moved these keys to model-gateway*; the old
    # OSS-named duplicates were deleted on 2026-11-07 with the provider aliases themselves
    # (INFRA-481), once every machine's config.local.yml routed roles at model-gateway* ids.
advisor:
  enabled: true
# omp's own interceptor stays on in this shared file: a session that predates the experiments
# extension's bash gate (experiments/bash-gate*.ts) has no other bash gate.
bashInterceptor:
  enabled: true
# The status-line git integration (branch, dirty counts, PR) re-runs
# `git status --porcelain --untracked-files=normal` as a child process every
# 2-3 s per session; in agent-c that is ~150k filesystem calls and 0.45 s per
# run, and parsing its output churns the native allocator (AGENTC-814). Sami
# does not read the footer's branch or counts.
git:
  enabled: false
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  # Only deliberate saves are stored: the retain and learn tools, and an explicit
  # `/memory enqueue`. autoRetain would store a raw transcript slice every 4 user
  # turns and at session exit; those slices outranked deliberate saves in recall
  # (AGENTC-1305).
  autoRetain: false
  polyphonicRecall: true
  enhancedRecall: true
  proactiveLinking: true
theme:
  dark: titanium
symbolPreset: unicode
hideThinkingBlock: true
doubleEscapeAction: tree
extendedContext: true
dev:
  autoqaConsent: granted
# omp's setup wizard shows every scene newer than this number at each interactive start that is
# not a resume, and holds the session's first prompt until a person answers it. Its answer goes
# only to the profile's own config.yml (setupVersion, update.auto), which this committed value
# overrides, so the wizard came back at every start. The pinned releases since
# v18.18.6-sami.20261110-032522 have setup version 3, whose one new scene is "Keep omp up to
# date" (measured 2026-11-17 on that release and on v18.18.6-sami.20261117-053702: with 2 here a
# fresh session, one started with a prompt included, stops at that scene; with 3 it does not).
# Keep this equal to the pinned release's CURRENT_SETUP_VERSION
# (packages/tui/src/setup/setup-version.ts in the fork).
setupVersion: 3
# The update check asks upstream (can1357/oh-my-pi) and `omp update` would
# `mise upgrade github:can1357/oh-my-pi` - the fork's pin in mise.toml is the
# only version of record; no banner steering a session toward upstream.
startup:
  checkUpdate: false
display:
  smoothStreaming: false
  hideToolActivity: false
  shimmer: disabled
  # Keep the transcript before each compaction inline, behind a divider. The
  # default (true) rebuilds the live transcript from only the kept tail and
  # clears scrollback, so everything before a compaction or handoff vanishes
  # from both the fullscreen viewport and the normal screen's scrollback.
  collapseCompacted: false
tui:
  resizeScrollback: preserve
  rewindScrollback: preserve
# No inline word predictions (dim ghost text after the cursor, accepted with
# Tab). The default, auto, predicts from prompt history on every platform.
spelling:
  autocomplete: "off"
# Ready sessions join the attention queue (omp/extensions/attention-queue.ts,
# scripts/tmux-attention) instead of ringing the bell: under tmux each of these
# writes an OSC 9 plus a BEL, Ghostty asks the desktop for attention, and
# Pop!_OS moves focus to that window.
completion:
  notify: "off"
ask:
  notify: "off"
error:
  notify: "off"
skills:
  ignoredSkills:
    - ce-commit-push-pr
    - ce-work
    - ce-worktree
    - lfg
    # writing-agent-skills (plugins/sjawhar) is the one skill-writing skill.
    # These three give other rules for the same work, so an agent that loads
    # one beside it gets two procedures. writing-skills is superpowers'.
    # skill-creator matches the dotfiles copy and Anthropic's plugin by name.
    # The dotfiles copies of skill-creator and skill-evals also set
    # disable-model-invocation, which hides them in Claude Code too.
    - writing-skills
    - skill-creator
    - skill-evals
    # Sami, 2026-11-02: he no longer uses the time-tracker tool this skill is
    # built on, and its recaps were the ones he called garbage. Its replacement
    # is plugins/sjawhar/skills/writing-a-standup-recap, which drafts from
    # pull requests, Dispatch records and his own past feedback. The two load
    # on the same words, so both cannot stay. time-tracker's other two skills
    # (todo, weekly-review) are untouched.
    - daily-standup
    # Dropped because their live (shortened) descriptions, what a session
    # actually sees in its skills list, trigger on work that doesn't need
    # Pulumi: pulumi-overview fires on any cloud/SaaS task and can silently
    # provision a Pulumi Cloud account (CLAUDE.md requires asking before
    # creating an account on an outside platform); pulumi-esc leads with
    # generic secrets/environments/OIDC triggers that overlap using-secrets,
    # even though it also names Pulumi stack config; package-usage and
    # pulumi-context-api fire on generic cross-stack/package-audit questions
    # with no Pulumi mention at all.
    - package-usage
    - pulumi-context-api
    - pulumi-esc
    - pulumi-overview
    - sentry-android-sdk
    - sentry-browser-sdk
    - sentry-cocoa-sdk
    - sentry-code-review
    - sentry-create-alert
    - sentry-dotnet-sdk
    - sentry-feature-setup
    - sentry-fix-issues
    - sentry-go-sdk
    - sentry-nestjs-sdk
    - sentry-nextjs-sdk
    - sentry-node-sdk
    - sentry-otel-exporter-setup
    - sentry-php-sdk
    - sentry-pr-code-review
    - sentry-react-native-sdk
    - sentry-react-sdk
    - sentry-ruby-sdk
    - sentry-sdk-setup
    - sentry-sdk-skill-creator
    - sentry-sdk-upgrade
    - sentry-setup-ai-monitoring
    - sentry-svelte-sdk
    - sentry-workflow
    # The ctx-memory plugin (omp/plugins/package.json) ships the ingest cycle's
    # procedure beside the reading skill. Only the scheduled cycle runs it, in
    # its own image; a session here reads the graph with ctx-memory.
    - ctx-memory-ingest
# 1-hour prompt-cache entries (dispatch://INFRA-1058). Without it omp writes 5-minute entries on an API key, so a
# session idle 5-60 minutes (waiting on a reviewer, a job, a subagent) writes its whole context again. Here, not in
# the machine-local config.local.yml: shims/omp loads that file for the default profile only, so `--profile pbc`
# never had it, and two rewrites of it on 2026-11-03 dropped it. It reaches every provider: omp/models.yml turns off
# the per-token OpenAI flags `long` would change (12h/24h retention at a higher write price); openai-codex and Google
# ignore it, and on Anthropic it marks `ttl: 1h` only where the model's compat has supportsLongCacheRetention.
providers:
  cacheRetention: long
  anthropic:
    serverSideFallback: true
    # Sent only when the primary is Fable/Mythos. Every entry must be in that
    # primary's allowed_fallback_models (GET /v1/models/<id> with the
    # server-side-fallback-2026-06-01 beta), or the whole request 400s. On
    # 2026-09-22 both Fable 5 and 5.1 allow only claude-opus-5 and claude-opus-4-8;
    # claude-opus-5-5 is not a valid target. At most three entries; order = preference.
    # Bare model ids only: this list is sent to Anthropic as is, and an effort suffix
    # (`claude-opus-4-8:high`) is no model id, so the whole request 400s and every
    # Fable call walks the client chain instead (2026-11-12 to 2026-11-14, measured
    # on claude-fable-5, 5-1 and 5-2).
    serverSideFallbackModels:
      - claude-opus-5
      - claude-opus-4-8
composer:
  shape: box
isolation:
  backend: auto
# Off (omp's default is on, dispatch://INFRA-3990). On, the bash tool runs every `git worktree add`
# as `omp worktree add`, which reflink-copies the whole source checkout: each other session's tree
# under `.worktrees/` too, its `.git` file still naming that tree's admin directory, so git in the
# copy works on the original's index and HEAD. The call never reaches shims/git, so the new tree
# gets no AGENTC-431 lock, and a copy the bash timeout cuts short stays as a partial tree with no
# `.git` (78 GB at one path on 2026-11-16). Off, `git worktree add` reaches git as typed, and
# `github pr_checkout` and `/wt` check out plainly.
worktree:
  clone: false
codexResets:
  autoRedeem: "yes"
# dispatch://INFRA-339: pi-envoy exports DISPATCH_HOST, DISPATCH_SESSION_ID and
# ENVOY_CONFIG_FILE for the session, and Legion panes get DISPATCH_URL; the
# Python eval kernel drops every variable outside its allowlist, so `dispatch`
# from an eval cell failed with "DISPATCH_HOST is not set". This admits them.
# Read by omp v18.12.2-sami.20261025-065250 and later; older builds load the
# file and leave the key unread.
# extensions/session-env.ts exports the session's identity for child processes:
# OMP_SESSION_ID (agent-secrets, scripts/envoy, nested omp, shims/git's
# Omp-Session trailer) and JJ_CONFIG (jj's Omp-Session trailer and the
# cross-session immutable_heads() guard); PI_COMMIT_TRAILERS passes already as
# a PI_ variable. Admitting both names gives a command run from an eval cell
# the identity it gets from bash. omp sets neither variable itself, so this
# belongs here, not in omp's built-in allowlist. GH_CONFIG_DIR (session-env.ts,
# scripts/agent-session) is the gh config directory with no login of the user's:
# without it a kernel's gh reads ~/.config/gh, and on 2026-11-02T00:07Z an eval
# cell's `gh pr review --approve` approved a pull request as the user that way.
# GOOGLE_APPLICATION_CREDENTIALS (same two places) names the machine's own
# Google identity: without it a kernel's google.auth.default() reads the
# well-known ADC file, which is the user's own login on sami-rocqperf.
# The cache directories scripts/agent-session and .bashrc set on the big disk
# (dispatch://INFRA-613) did not reach a kernel either. On 2026-11-21 a fresh
# kernel had none of the eight below while its omp parent had them all, and its
# CARGO_HOME was mise's ~/.cargo default. `go test` runs from eval cells used
# Go's default ~/.cache/go-build, which grew to 475 GB with no cap. Each name is
# a cache path, not a secret. UV_LINK_MODE goes with UV_CACHE_DIR (agent-session
# says why). mise's python3 shim keeps a CARGO_HOME it is given and sets
# ~/.cargo only when there is none.
# The rest of the session environment those two set, for the same reason: the
# session's own TMPDIR root and Go build tree (AGENT_SESSION_SCRATCH, GOTMPDIR,
# which session-scratch-reap removes with the session), mise's store and cache
# (MISE_DATA_DIR, MISE_CACHE_DIR), the browser downloads (PLAYWRIGHT_BROWSERS_PATH,
# PUPPETEER_CACHE_DIR) and npm's global prefix (NPM_CONFIG_PREFIX). Without
# PLAYWRIGHT_SKIP_BROWSER_GC a `playwright install` from an eval cell deletes
# every browser whose links it cannot read in the browsers directory agent boxes
# share (.bashrc says why); on 2026-11-21 a fresh kernel had none of the eight.
eval:
  envPassthrough:
    names:
      - OMP_SESSION_ID
      - JJ_CONFIG
      - GH_CONFIG_DIR
      - GOOGLE_APPLICATION_CREDENTIALS
      - GOCACHE
      - GOMODCACHE
      - UV_CACHE_DIR
      - UV_LINK_MODE
      - CARGO_HOME
      - PIP_CACHE_DIR
      - BUN_INSTALL_CACHE_DIR
      - HF_HOME
      - AGENT_SESSION_SCRATCH
      - GOTMPDIR
      - MISE_DATA_DIR
      - MISE_CACHE_DIR
      - PLAYWRIGHT_BROWSERS_PATH
      - PLAYWRIGHT_SKIP_BROWSER_GC
      - PUPPETEER_CACHE_DIR
      - NPM_CONFIG_PREFIX
    prefixes:
      - DISPATCH_
      - ENVOY_
