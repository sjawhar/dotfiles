providers:
  # omp/config.yml sets `providers.cacheRetention: long` for 1-hour Claude cache entries (dispatch://INFRA-1058), and
  # that setting reaches every provider. On api.openai.com it would make GPT-5.6+ Responses requests send
  # `prompt_cache_options.ttl: 12h` (cache writes at 2.5x input, not 1.25x) and older models
  # `prompt_cache_retention: 24h`. Both flags off keeps per-token OpenAI requests exactly as under `auto`: omp sends
  # no explicit prompt-cache policy, so nothing else reads them. Tracked, so it holds on every machine and profile.
  openai:
    compat:
      supportsPromptCacheBreakpoints: false
      supportsLongPromptCacheRetention: false
  anthropic:
    # Universal catalog patches only. Anything that targets one machine's network
    # or credentials — a gateway baseUrl, an `!command` apiKey — is machine-local
    # and belongs in omp/models.local.yml (gitignored); installers/omp.sh merges
    # that file over this one and writes the result to ~/.omp/agent/models.yml.
    modelOverrides:
      # Installed pi-catalog is stale: claude-opus-5 supports xhigh per Anthropic docs
      # (https://platform.claude.com/docs/en/build-with-claude/effort - "Claude Opus 5
      # supports all five effort levels"). Patch replaces thinking wholesale, so this
      # carries the full base config plus xhigh. Remove when pi-catalog ships it.
      claude-opus-5:
        thinking:
          mode: anthropic-adaptive
          efforts:
            - low
            - medium
            - high
            - xhigh
            - max
          supportsDisplay: true
