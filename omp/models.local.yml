providers:
  anthropic:
    # Machine-local (gitignored): this box has the agent-c checkout, so route the
    # anthropic catalog through the Hawk gateway with a per-person token from
    # scripts/hawk-token. The gateway reads the token from x-api-key only; omp
    # sends Authorization: Bearer to a custom base and adds X-Api-Key only when
    # given explicitly, so one command backs both (one cached mint, both re-run
    # on a 401). hawk-token pairs the Hawk API URL with this gateway: both name
    # the production stack (armed 2026-09-15); change both together.
    baseUrl: https://middleman.hawk.internal.trajectorylabs.com/anthropic
    apiKey: "!hawk-token"
    headers:
      X-Api-Key: "!hawk-token"
