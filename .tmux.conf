# Devpod tmux configuration
# Optimized for mobile voice dictation and multi-device session sharing

# Adapt to most recent client's terminal size (essential for phone/laptop switching)
set-option -g window-size latest

# Deep scrollback, capped: server RSS grows with history, and every
# hook/status-line fork copies the server's page tables
set -g history-limit 20000

# Mouse support (essential for mobile/touch)
set -g mouse on

# Start windows and panes at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Reduce escape delay (faster vim mode switching)
set -sg escape-time 10

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Pass OSC 8 hyperlinks through to the outer terminal (Ghostty). Without this,
# tmux strips semantic hyperlinks and Ghostty falls back to regex URL detection,
# which breaks on wrapped lines because tmux repaints row-by-row.
set -as terminal-features ',xterm-ghostty:hyperlinks'
# mosh/ssh paths often downgrade TERM to xterm-256color; Ghostty is still the real
# outer terminal, so advertise hyperlinks for that too. Terminals that don't
# support OSC 8 ignore the sequences harmlessly.
set -as terminal-features ',xterm-256color:hyperlinks'

# OSC 52 clipboard fix for mosh. tmux's built-in clipboard sends '52;;data'
# (empty selection field) which SSH passes through but mosh 1.4.0 rejects.
# This script sends '52;c;data' directly to the client terminal.
set -s copy-command '$HOME/.dotfiles/scripts/tmux-osc52-copy'

# Accept OSC 52 from applications inside tmux (omp /copy etc). The default
# ('external') IGNORES application OSC 52 entirely - it only sets the outer
# clipboard for tmux's own copy-mode. 'on' stores the copy as a tmux buffer AND
# forwards it to clients preserving the app's 'c' selection flag ('52;c;data'),
# which mosh 1.4.0 requires verbatim. Copy-mode still goes via copy-command above.
set -s set-clipboard on

# Focus events for vim autoread
set -g focus-events on

# Prevent bells from propagating across grouped sessions (avoids focus stealing)
set -g bell-action current

# Allow passthrough escape sequences (for terminal graphics, OSC queries, etc.)
set -g allow-passthrough on 

# Extended keys: pass modifier combos (Ctrl+Shift+Letter, etc.) to apps inside tmux.
# Without this, some neovim/editor keybindings silently fail. Requires tmux 3.5+.
set -g extended-keys on
# Prefix key: Ctrl+B (default, no conflicts with readline/vim/Claude)
# Reminder: Ctrl+B, then key. All other keys pass through.

# Easy reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# URL menu: extract URLs from pane (wrapped lines joined). Prefix+u then a hint
# key copies via OSC 52; prefix+O opens in the laptop browser via `forward open`.
# Needed over mosh, which strips OSC 8 hyperlinks and breaks Ghostty's regex
# link detection on wrapped lines. Opening covers tools that print a URL instead
# of calling xdg-open, which forward never sees otherwise.
# #{pane_id} is required: capture-pane with no -t resolves to whatever the server
# last considered current, which is the wrong pane once several clients are
# attached. Not prefix+U: tpm loads after this file and binds U to update_plugins.
bind u run-shell '$HOME/.dotfiles/scripts/tmux-urls menu copy #{pane_id}'
bind O run-shell '$HOME/.dotfiles/scripts/tmux-urls menu open #{pane_id}'
# omp session IDs: S copies `omp --resume <id>` (the exit hint is always slot 1),
# Y copies the bare UUID. Not R/I: tpm binds those to reload/install_plugins.
bind S run-shell '$HOME/.dotfiles/scripts/tmux-omp-ids menu resume #{pane_id}'
bind Y run-shell '$HOME/.dotfiles/scripts/tmux-omp-ids menu copy #{pane_id}'

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move pane in direction (H/J/K/L - like aerospace alt-shift)
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# Resize pane (arrow keys, repeatable)
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Full-spanning splits (new pane spans full window height/width)
bind | split-window -fh -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"

# Break pane to new window (Ctrl+B, !)
# This is default, just documenting it

# Force detach other clients (useful when switching devices)
bind D detach-client -a

# Status bar - clean and informative
set -g status-style 'bg=#1a1b26 fg=#c0caf5'
set -g status-left-length 40
set -g status-left '#[fg=#7aa2f7,bold][#S] '
set -g status-right '#[fg=#9ece6a]%H:%M'
set -g window-status-current-style 'fg=#e0af68,bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '

# Pane borders - subtle
set -g pane-border-style 'fg=#3b4261'
# Show each pane's OSC title on its border - omp/opencode set these live
# (task summary + spinner), so this is the per-session "what is it doing" line.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold],}#{pane_index} #{pane_title} "
set -g pane-active-border-style 'fg=#7aa2f7'

# TPM (Tmux Plugin Manager) - for session resurrection
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
# omp panes: the save hook rewrites each one to `omp --resume <id>` (it reads
# the session file the omp process holds open), and the process list restores
# exactly that command. Panes it cannot resolve come back as a shell in place.
set -g @resurrect-hook-post-save-layout '$HOME/.dotfiles/scripts/tmux-resurrect-omp'
set -g @resurrect-processes '"~omp --resume"'

# Time-tracker: record pane focus events for time tracking.
# pane-focus-in covers every navigation path (pane/window/session switch, attach)
# by itself — one hook means one server fork per navigation. Depends on
# focus-events, set explicitly rather than relying on tmux-sensible.
# Errors logged to ~/.local/state/time-tracker/hook.log
set -g focus-events on
set-hook -g pane-focus-in 'run-shell -b "mkdir -p $HOME/.local/state/time-tracker && tt ingest pane-focus --pane \"#{pane_id}\" --cwd \"#{pane_current_path}\" --session \"#{session_name}\" --window \"#{window_index}\" 2>>$HOME/.local/state/time-tracker/hook.log"'

# Workspace snapshot: auto-capture layout + OC sessions on structural changes
# Disabled: hooks fire before OC sessions register, so panes are always empty.
# Use periodic cron or manual `tmux-snapshot` instead.
# set-hook -g after-new-window 'run-shell -b "$HOME/.dotfiles/scripts/tmux-snapshot 2>/dev/null"'
# set-hook -g after-split-window 'run-shell -b "$HOME/.dotfiles/scripts/tmux-snapshot 2>/dev/null"'
# set-hook -g pane-exited 'run-shell -b "$HOME/.dotfiles/scripts/tmux-snapshot 2>/dev/null"'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible sets status-interval 5 — each refresh forks the server. Keep the
# interval long; must come after TPM init to win over tmux-sensible.
set -g status-interval 60

# Auto-save / auto-restore, on the default server only. After TPM on purpose:
# tmux-continuum edits status-right when it loads, and this block has the last
# word on it.
#
# tmux-continuum's own "another tmux server is running" guard is not relied on:
# it greps `ps` for commands starting with `tmux`, so it misses servers started
# by full path and counts every client and stray `tmux` process of this user.
# It silently turned off both the periodic save and the restore-on-start (the
# save stopped for two weeks). @continuum-restore stays off; the save check and
# the restore are wired here instead.
#
# Gated on the socket name because every tmux server on this box sources this
# file: a scratch `tmux -L` server that restores the snapshot relaunches every
# omp session a second time, headless, acting on the same work (2026-09-09).
# `if-shell -F` evaluates the format in-process, no shell involved.
if-shell -F '#{==:#{b:socket_path},default}' {
    # continuum's periodic-save check; forks once per status refresh.
    set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=#9ece6a]%H:%M'
    # First save waits one interval so a fresh server cannot overwrite the last
    # save before restore has run.
    run-shell 'tmux show -gqv @continuum-save-last-timestamp | grep -q . || tmux set -g @continuum-save-last-timestamp "$(date +%s)"'
    # Restore only when the server itself just started, never on config reload.
    run-shell -b -d 1 '[ $(( $(date +%s) - #{start_time} )) -lt 10 ] && exec ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'
} {
    # Not the workspace: never save (interval 0 is continuum's off switch) and
    # drop the save check continuum may have injected.
    set -g @continuum-save-interval 0
    set -g status-right '#[fg=#9ece6a]%H:%M'
}
